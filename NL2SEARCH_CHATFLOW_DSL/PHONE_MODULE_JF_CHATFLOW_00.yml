            "source_code": "def main(jf_registry_raw_json='', jf_registry_load_status=''):\n    import json\n    import re\n    import unicodedata\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    def fail(status, message, warnings=None):\n        return {\n            'jf_registry_json': '{}',\n            'jf_alias_index_json': '{}',\n            'jf_registry_parse_status': status,\n            'jf_registry_warnings_json': dump(warnings or []),\n            'jf_registry_error': message,\n        }\n\n    def normalize(value):\n        text = unicodedata.normalize('NFKC', str(value or '')).strip().casefold()\n        return re.sub(r'[\\s_\\-]+', '', text)\n\n    def valid_identifier(value):\n        return bool(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', str(value or '')))\n\n    if str(jf_registry_load_status or '') != 'ok':\n        return fail(str(jf_registry_load_status or 'missing'), 'JF 查询配置未加载，无法生成 SQL 查询。')\n\n    try:\n        registry = json.loads(jf_registry_raw_json or '{}')\n    except Exception as exc:\n        return fail('error', 'JF_QUERY_REGISTRY_JSON 不是合法 JSON：%s' % exc)\n\n    if not isinstance(registry, dict):\n        return fail('error', 'JF_QUERY_REGISTRY_JSON 顶层不是对象。')\n\n    table = str(registry.get('table') or '').strip()\n    fields = registry.get('fields') if isinstance(registry.get('fields'), dict) else {}\n    composites = registry.get('composite_fields') if isinstance(registry.get('composite_fields'), dict) else {}\n    query_roles = registry.get('query_roles') if isinstance(registry.get('query_roles'), dict) else {}\n    value_aliases = registry.get('value_aliases') if isinstance(registry.get('value_aliases'), dict) else {}\n    match_policies = registry.get('match_policies') if isinstance(registry.get('match_policies'), dict) else {}\n\n    warnings = []\n    errors = []\n\n    if 'match_policies' in registry and not isinstance(registry.get('match_policies'), dict):\n        errors.append('registry.match_policies 不是对象')\n    if not table or not valid_identifier(table):\n        errors.append('registry.table 缺失或不是安全 SQL 标识符')\n    if not fields:\n        errors.append('registry.fields 缺失或为空')\n\n    sql_filter_fields = query_roles.get('sql_filter_fields') if isinstance(query_roles.get('sql_filter_fields'), list) else []\n    for field in sql_filter_fields:\n        if field not in fields:\n            errors.append('sql_filter_fields 包含未定义字段: %s' % field)\n        if not valid_identifier(field):\n            errors.append('sql_filter_fields 包含非法字段名: %s' % field)\n\n    for field_name, field_cfg in fields.items():\n        if not valid_identifier(field_name):\n            errors.append('fields 包含非法字段名: %s' % field_name)\n        aliases = field_cfg.get('aliases') if isinstance(field_cfg, dict) else []\n        if not isinstance(aliases, list) or not aliases:\n            errors.append('字段缺少 aliases: %s' % field_name)\n\n    for composite_name, composite_cfg in composites.items():\n        if not isinstance(composite_cfg, dict):\n            errors.append('composite_fields.%s 不是对象' % composite_name)\n            continue\n        for ref in composite_cfg.get('expand_to') or []:\n            if ref not in fields:\n                errors.append('composite_fields.%s.expand_to 引用未定义字段: %s' % (composite_name, ref))\n\n    for value_field in value_aliases.keys():\n        if value_field not in fields:\n            warnings.append({'type': 'value_aliases_field_not_in_fields', 'field': value_field})\n        if value_field not in sql_filter_fields:\n            warnings.append({'type': 'value_aliases_field_not_sql_filter_field', 'field': value_field})\n\n    for policy_field, policy_cfg in match_policies.items():\n        if policy_field not in fields:\n            errors.append('match_policies 包含未定义字段: %s' % policy_field)\n        if not isinstance(policy_cfg, dict):\n            errors.append('match_policies.%s 不是对象' % policy_field)\n            continue\n        fuzzy = policy_cfg.get('fuzzy')\n        if fuzzy is None:\n            continue\n        if not isinstance(fuzzy, dict):\n            errors.append('match_policies.%s.fuzzy 不是对象' % policy_field)\n            continue\n        if not isinstance(fuzzy.get('enabled'), bool):\n            errors.append('match_policies.%s.fuzzy.enabled 必须为布尔值' % policy_field)\n            continue\n        if fuzzy.get('enabled') is not True:\n            continue\n        for boolean_key in ('require_same_digits', 'require_protected_tokens_equal'):\n            if not isinstance(fuzzy.get(boolean_key), bool):\n                errors.append('match_policies.%s.fuzzy.%s 必须为布尔值' % (policy_field, boolean_key))\n        min_alias_length = fuzzy.get('min_alias_length')\n        min_score_gap = fuzzy.get('min_score_gap')\n        rules = fuzzy.get('distance_rules')\n        tokens = fuzzy.get('protected_tokens')\n        if isinstance(min_alias_length, bool) or not isinstance(min_alias_length, int) or min_alias_length < 1:\n            errors.append('match_policies.%s.fuzzy.min_alias_length 必须为大于等于 1 的整数' % policy_field)\n        if isinstance(min_score_gap, bool) or not isinstance(min_score_gap, (int, float)) or not 0 <= min_score_gap <= 1:\n            errors.append('match_policies.%s.fuzzy.min_score_gap 必须在 [0,1] 内' % policy_field)\n        if not isinstance(rules, list) or not rules:\n            errors.append('match_policies.%s.fuzzy.distance_rules 必须为非空列表' % policy_field)\n        else:\n            for index, rule in enumerate(rules):\n                if not isinstance(rule, dict):\n                    errors.append('match_policies.%s.fuzzy.distance_rules[%s] 不是对象' % (policy_field, index))\n                    continue\n                max_length = rule.get('max_length')\n                max_distance = rule.get('max_distance')\n                if isinstance(max_length, bool) or not isinstance(max_length, int) or max_length < 1:\n                    errors.append('match_policies.%s.fuzzy.distance_rules[%s].max_length 非法' % (policy_field, index))\n                if isinstance(max_distance, bool) or not isinstance(max_distance, int) or max_distance < 0:\n                    errors.append('match_policies.%s.fuzzy.distance_rules[%s].max_distance 非法' % (policy_field, index))\n        if not isinstance(tokens, list) or not tokens or any(not isinstance(token, str) or not token.strip() for token in tokens):\n            errors.append('match_policies.%s.fuzzy.protected_tokens 必须为非空字符串列表' % policy_field)\n        token_fuzzy = fuzzy.get('protected_token_fuzzy')\n        if token_fuzzy is not None:\n            if not isinstance(token_fuzzy, dict):\n                errors.append('match_policies.%s.fuzzy.protected_token_fuzzy 不是对象' % policy_field)\n            elif not isinstance(token_fuzzy.get('enabled'), bool):\n                errors.append('match_policies.%s.fuzzy.protected_token_fuzzy.enabled 必须为布尔值' % policy_field)\n            elif token_fuzzy.get('enabled') is True:\n                token_max_distance = token_fuzzy.get('max_distance')\n                if isinstance(token_max_distance, bool) or not isinstance(token_max_distance, int) or token_max_distance < 0:\n                    errors.append('match_policies.%s.fuzzy.protected_token_fuzzy.max_distance 非法' % policy_field)\n\n    if errors:\n        return fail('error', '；'.join(errors), warnings)\n\n    def build_unique_alias_map(items):\n        buckets = {}\n        for target, aliases in items:\n            for alias in aliases:\n                key = normalize(alias)\n                if not key:\n                    continue\n                buckets.setdefault(key, set()).add(target)\n        unique = {}\n        conflicts = {}\n        for key, targets in buckets.items():\n            if len(targets) == 1:\n                unique[key] = next(iter(targets))\n            else:\n                conflicts[key] = sorted(targets)\n        return unique, conflicts\n\n    field_items = []\n    field_meta = {}\n    for field_name, field_cfg in fields.items():\n        aliases = [field_name]\n        if isinstance(field_cfg, dict):\n            aliases.append(str(field_cfg.get('label') or ''))\n            aliases.extend(str(a) for a in field_cfg.get('aliases') or [])\n            field_meta[field_name] = {\n                'label': field_cfg.get('label') or field_name,\n                'description': field_cfg.get('description') or '',\n                'aliases': field_cfg.get('aliases') or [],\n            }\n        field_items.append((field_name, aliases))\n\n    composite_items = []\n    composite_meta = {}\n    for name, cfg in composites.items():\n        aliases = [name]\n        if isinstance(cfg, dict):\n            aliases.append(str(cfg.get('label') or ''))\n            aliases.extend(str(a) for a in cfg.get('aliases') or [])\n            composite_meta[name] = {\n                'label': cfg.get('label') or name,\n                'description': cfg.get('description') or '',\n                'aliases': cfg.get('aliases') or [],\n                'expand_to': cfg.get('expand_to') or [],\n            }\n        composite_items.append((name, aliases))\n\n    value_alias_to_filter = {}\n    value_alias_conflicts = {}\n    for field_name, field_values in value_aliases.items():\n        if not isinstance(field_values, dict):\n            continue\n        items = []\n        for canonical, cfg in field_values.items():\n            aliases = [canonical]\n            if isinstance(cfg, dict):\n                aliases.extend(str(a) for a in cfg.get('aliases') or [])\n            elif isinstance(cfg, list):\n                aliases.extend(str(a) for a in cfg)\n            items.append((canonical, aliases))\n        alias_map, conflicts = build_unique_alias_map(items)\n        if conflicts:\n            value_alias_conflicts[field_name] = conflicts\n        value_alias_to_filter[field_name] = alias_map\n\n    field_alias_to_field, field_conflicts = build_unique_alias_map(field_items)\n    composite_alias_to_name, composite_conflicts = build_unique_alias_map(composite_items)\n\n    if field_conflicts:\n        warnings.append({'type': 'field_alias_conflict_ignored', 'items': field_conflicts})\n    if composite_conflicts:\n        warnings.append({'type': 'composite_alias_conflict_ignored', 'items': composite_conflicts})\n    if value_alias_conflicts:\n        return fail(\n            'error',\n            'value_aliases 存在冲突，不能安全编译 SQL 查询。',\n            warnings + [{'type': 'value_alias_conflict', 'items': value_alias_conflicts}]\n        )\n\n    cross_conflicts = []\n    for alias in sorted(set(field_alias_to_field) & set(composite_alias_to_name)):\n        cross_conflicts.append({\n            'alias': alias,\n            'field': field_alias_to_field.get(alias),\n            'composite': composite_alias_to_name.get(alias),\n        })\n    if cross_conflicts:\n        warnings.append({'type': 'field_composite_alias_overlap', 'items': cross_conflicts})\n\n    alias_index = {\n        'normalization': 'NFKC + casefold + remove spaces/underscore/hyphen; plus sign is preserved',\n        'field_alias_to_field': field_alias_to_field,\n        'composite_alias_to_name': composite_alias_to_name,\n        'value_alias_to_filter': value_alias_to_filter,\n        'field_meta': field_meta,\n        'composite_meta': composite_meta,\n    }\n\n    registry_min = {\n        'version': registry.get('version') or '',\n        'table': table,\n        'query_roles': query_roles,\n        'fields': fields,\n        'composite_fields': composites,\n        'value_aliases': value_aliases,\n        'match_policies': match_policies,\n    }\n\n    return {\n        'jf_registry_json': dump(registry_min),\n        'jf_alias_index_json': dump(alias_index),\n        'jf_registry_parse_status': 'ok',\n        'jf_registry_warnings_json': dump(warnings),\n        'jf_registry_error': '',\n    }\n",
