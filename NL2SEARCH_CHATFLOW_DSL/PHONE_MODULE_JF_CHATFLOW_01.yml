            "source_code": "def main(jf_sql_plan_json='', context_json=''):\n    import json\n\n    def load_json(raw, default):\n        try:\n            obj = json.loads(raw or '')\n            return obj if isinstance(obj, type(default)) else default\n        except Exception:\n            return default\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    plan = load_json(jf_sql_plan_json, {})\n    context = load_json(context_json, {})\n\n    if plan.get('status') != 'ok':\n        message = plan.get('error') or 'SQL 查询计划无效。'\n        return {\n            'mysql_request_body_json': '{}',\n            'mysql_request_status': 'error',\n            'mysql_request_error_answer': 'MySQL 查询请求构建失败，原因：%s' % message,\n        }\n\n    sql = str(plan.get('sql') or '').strip()\n    params = plan.get('params') if isinstance(plan.get('params'), list) else []\n    user = str(context.get('user') or '').strip()\n\n    if not sql.lower().startswith('select '):\n        return {\n            'mysql_request_body_json': '{}',\n            'mysql_request_status': 'error',\n            'mysql_request_error_answer': 'MySQL 查询请求构建失败：只允许 SELECT 查询。',\n        }\n\n    return {\n        'mysql_request_body_json': dump({'sql': sql, 'params': params, 'user': user}),\n        'mysql_request_status': 'ok',\n        'mysql_request_error_answer': '',\n    }\n",
