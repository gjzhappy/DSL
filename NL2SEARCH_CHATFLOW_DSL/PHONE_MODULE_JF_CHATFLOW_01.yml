            "source_code": "def main(context_json='', jf_registry_json='', jf_alias_index_json='', jf_registry_parse_status='', jf_registry_error=''):\n    import json\n    import re\n    import unicodedata\n\n    def load_json(raw, default):\n        try:\n            obj = json.loads(raw or '')\n            return obj if isinstance(obj, type(default)) else default\n        except Exception:\n            return default\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    def normalize(value):\n        text = unicodedata.normalize('NFKC', str(value or '')).strip().casefold()\n        return re.sub(r'[\\s_\\-]+', '', text)\n\n    def valid_identifier(value):\n        return bool(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', str(value or '')))\n\n    def as_int(value, default):\n        try:\n            n = int(value)\n            return n if n > 0 else default\n        except Exception:\n            return default\n\n    def fail(status, message):\n        payload = {\n            'status': status,\n            'backend': 'mysql_http',\n            'readonly': True,\n            'error': message,\n        }\n        return {\n            'jf_sql_plan_json': dump(payload),\n            'jf_sql_compile_status': status,\n            'jf_sql_compile_error_answer': 'JF SQL 查询计划生成失败，原因：%s' % message,\n            'jf_selected_field_meta_json': '{}',\n            'jf_select_field_summary': '',\n        }\n\n    if str(jf_registry_parse_status or '') != 'ok':\n        return fail(str(jf_registry_parse_status or 'error'), jf_registry_error or 'JF registry 未成功解析。')\n\n    ctx = load_json(context_json, {})\n    registry = load_json(jf_registry_json, {})\n    alias_index = load_json(jf_alias_index_json, {})\n\n    question = str(ctx.get('question') or '')\n    table = str(registry.get('table') or '').strip()\n    fields = registry.get('fields') if isinstance(registry.get('fields'), dict) else {}\n    query_roles = registry.get('query_roles') if isinstance(registry.get('query_roles'), dict) else {}\n    sql_filter_fields = query_roles.get('sql_filter_fields') if isinstance(query_roles.get('sql_filter_fields'), list) else []\n    sql_select_mode = query_roles.get('sql_select_fields') or 'all_fields'\n    limit = 200\n\n    if not question.strip():\n        return fail('error', '用户问题为空。')\n    if not table or not valid_identifier(table):\n        return fail('error', 'registry.table 缺失或非法。')\n    if not fields:\n        return fail('error', 'registry.fields 为空。')\n\n    allowed_fields = set(fields.keys())\n    filter_fields = [f for f in sql_filter_fields if f in allowed_fields]\n    if not filter_fields:\n        return fail('error', 'query_roles.sql_filter_fields 为空或均无效。')\n\n    field_alias_to_field = alias_index.get('field_alias_to_field') if isinstance(alias_index.get('field_alias_to_field'), dict) else {}\n    composite_alias_to_name = alias_index.get('composite_alias_to_name') if isinstance(alias_index.get('composite_alias_to_name'), dict) else {}\n    value_alias_to_filter = alias_index.get('value_alias_to_filter') if isinstance(alias_index.get('value_alias_to_filter'), dict) else {}\n    field_meta_all = alias_index.get('field_meta') if isinstance(alias_index.get('field_meta'), dict) else {}\n    composite_meta = alias_index.get('composite_meta') if isinstance(alias_index.get('composite_meta'), dict) else {}\n    match_policies = registry.get('match_policies') if isinstance(registry.get('match_policies'), dict) else {}\n\n    q_norm = normalize(question)\n\n    def find_alias_hit_items(alias_map, text_norm):\n        candidates = []\n        for alias, target in alias_map.items():\n            alias_text = normalize(alias)\n            if not alias_text:\n                continue\n            start = 0\n            while True:\n                idx = text_norm.find(alias_text, start)\n                if idx < 0:\n                    break\n                candidates.append({\n                    'alias': alias_text,\n                    'target': target,\n                    'start': idx,\n                    'end': idx + len(alias_text),\n                    'length': len(alias_text),\n                })\n                start = idx + 1\n        candidates.sort(key=lambda x: (-x['length'], x['start'], str(x['target'])))\n        selected = []\n        occupied = []\n        for item in candidates:\n            span = (item['start'], item['end'])\n            if any(span[0] < used[1] and used[0] < span[1] for used in occupied):\n                continue\n            selected.append(item)\n            occupied.append(span)\n        selected.sort(key=lambda x: (x['start'], -x['length'], str(x['target'])))\n        return selected\n\n    def unique_targets(items):\n        values = []\n        for item in items:\n            if item['target'] not in values:\n                values.append(item['target'])\n        return values\n\n    def overlaps(span, occupied):\n        return any(span[0] < used[1] and used[0] < span[1] for used in occupied)\n\n    def damerau_levenshtein(left, right, cutoff):\n        if abs(len(left) - len(right)) > cutoff:\n            return cutoff + 1\n        previous_previous = None\n        previous = list(range(len(right) + 1))\n        for i, left_char in enumerate(left, 1):\n            current = [i]\n            for j, right_char in enumerate(right, 1):\n                value = min(current[j - 1] + 1, previous[j] + 1, previous[j - 1] + (left_char != right_char))\n                if previous_previous is not None and i > 1 and j > 1 and left_char == right[j - 2] and left[i - 2] == right_char:\n                    value = min(value, previous_previous[j - 2] + 1)\n                current.append(value)\n            previous_previous, previous = previous, current\n        return previous[-1]\n\n    def protected_occurrences(text, protected_tokens):\n        occupied = []\n        found = []\n        for token in sorted(set(protected_tokens), key=lambda item: (-len(item), item)):\n            start = 0\n            while True:\n                index = text.find(token, start)\n                if index < 0:\n                    break\n                span = (index, index + len(token))\n                if not overlaps(span, occupied):\n                    found.append({'token': token, 'start': span[0], 'end': span[1]})\n                    occupied.append(span)\n                start = index + 1\n        return sorted(found, key=lambda item: (item['start'], item['end'], item['token']))\n\n    def protected_signature(text, protected_tokens):\n        return tuple(item['token'] for item in protected_occurrences(text, protected_tokens))\n\n    def fuzzy_alias_matches(alias_map, text_norm, exact_spans, policy):\n        rules = sorted(policy.get('distance_rules') or [], key=lambda rule: rule['max_length'])\n        protected_tokens = [normalize(token) for token in policy.get('protected_tokens') or []]\n        token_fuzzy = policy.get('protected_token_fuzzy') if isinstance(policy.get('protected_token_fuzzy'), dict) else {}\n        token_fuzzy_enabled = token_fuzzy.get('enabled') is True\n        configured_token_distance = token_fuzzy.get('max_distance', 0)\n        min_length = policy['min_alias_length']\n        gap = float(policy['min_score_gap'])\n        require_digits = policy.get('require_same_digits') is True\n        require_tokens = policy.get('require_protected_tokens_equal') is True\n        prepared = []\n        for alias, target in alias_map.items():\n            alias_text = normalize(alias)\n            if len(alias_text) < min_length:\n                continue\n            rule = next((item for item in rules if len(alias_text) <= item['max_length']), None)\n            if rule is None:\n                continue\n            alias_digits = re.findall(r'\\d+', alias_text)\n            if require_digits and not alias_digits:\n                continue\n            occurrences = protected_occurrences(alias_text, protected_tokens)\n            prepared.append((alias_text, target, rule['max_distance'], alias_digits, occurrences))\n\n        distance_cache = {}\n        signature_cache = {}\n        mapping_cache = {}\n        core_cache = {}\n\n        def distance(left, right, cutoff):\n            key = (left, right, cutoff)\n            if key not in distance_cache:\n                distance_cache[key] = damerau_levenshtein(left, right, cutoff)\n            return distance_cache[key]\n\n        def map_protected(fragment, alias_text, alias_occurrences, max_distance):\n            key = (fragment, alias_text, tuple((x['token'], x['start'], x['end']) for x in alias_occurrences), max_distance, configured_token_distance)\n            if key in mapping_cache:\n                return mapping_cache[key]\n            choices = []\n            for occurrence in alias_occurrences:\n                token = occurrence['token']\n                token_limit = 0 if len(token) < 3 else configured_token_distance\n                expected = occurrence['start']\n                candidates = []\n                for start in range(max(0, expected - max_distance), min(len(fragment), expected + max_distance) + 1):\n                    for length in range(max(1, len(token) - token_limit), len(token) + token_limit + 1):\n                        end = start + length\n                        if end > len(fragment):\n                            continue\n                        local_distance = distance(fragment[start:end], token, token_limit)\n                        if local_distance <= token_limit:\n                            candidates.append((local_distance, abs(start - expected), abs(length - len(token)), start, end))\n                candidates.sort()\n                choices.append(candidates)\n            best = None\n            def visit(index, previous_end, mapped):\n                nonlocal best\n                if index == len(choices):\n                    rank = tuple(value for item in mapped for value in item[:4])\n                    if best is None or rank < best[0]:\n                        best = (rank, list(mapped))\n                    return\n                for candidate in choices[index]:\n                    if candidate[3] < previous_end:\n                        continue\n                    visit(index + 1, candidate[4], mapped + [candidate])\n            visit(0, 0, [])\n            mapping_cache[key] = best[1] if best else None\n            return mapping_cache[key]\n\n        by_span = {}\n        for alias_text, target, max_distance, alias_digits, alias_occurrences in prepared:\n            alias_tokens = tuple(item['token'] for item in alias_occurrences)\n            for window_length in range(max(1, len(alias_text) - max_distance), len(alias_text) + max_distance + 1):\n                for start in range(0, len(text_norm) - window_length + 1):\n                    span = (start, start + window_length)\n                    if overlaps(span, exact_spans):\n                        continue\n                    fragment = text_norm[start:span[1]]\n                    overall_distance = distance(fragment, alias_text, max_distance)\n                    if overall_distance > max_distance:\n                        continue\n                    signatures = signature_cache.setdefault(span, (re.findall(r'\\d+', fragment), protected_signature(fragment, protected_tokens)))\n                    if require_digits and signatures[0] != alias_digits:\n                        continue\n                    score = 1.0 - float(overall_distance) / max(len(fragment), len(alias_text))\n                    mode = None\n                    primary_score = score\n                    if not require_tokens or signatures[1] == alias_tokens:\n                        mode = 'overall'\n                    elif token_fuzzy_enabled and require_tokens and alias_occurrences:\n                        mapped = map_protected(fragment, alias_text, alias_occurrences, max_distance)\n                        if mapped is not None:\n                            alias_spans = [(item['start'], item['end']) for item in alias_occurrences]\n                            fragment_spans = [(item[3], item[4]) for item in mapped]\n                            alias_core = ''.join(char for index, char in enumerate(alias_text) if not any(left <= index < right for left, right in alias_spans))\n                            fragment_core = ''.join(char for index, char in enumerate(fragment) if not any(left <= index < right for left, right in fragment_spans))\n                            core_key = (fragment_core, alias_core, max_distance)\n                            if core_key not in core_cache:\n                                core_cache[core_key] = distance(fragment_core, alias_core, max_distance)\n                            core_distance = core_cache[core_key]\n                            token_distance_sum = sum(item[0] for item in mapped)\n                            if core_distance + token_distance_sum <= max_distance:\n                                mode = 'segmented'\n                    if mode is None:\n                        continue\n                    candidate = {'input': fragment, 'alias': alias_text, 'target': target, 'distance': overall_distance, 'score': score, 'primary_score': primary_score, 'mode': mode, 'start': start, 'end': span[1], 'length': window_length}\n                    current = by_span.setdefault(span, {}).get(target)\n                    rank = (-primary_score, overall_distance, -window_length, start, str(target), alias_text)\n                    current_rank = (-current['primary_score'], current['distance'], -current['length'], current['start'], str(current['target']), current['alias']) if current else None\n                    if current is None or rank < current_rank:\n                        by_span[span][target] = candidate\n        groups = []\n        for span, canonical_map in by_span.items():\n            ranked = sorted(canonical_map.values(), key=lambda item: (-item['primary_score'], item['distance'], -item['length'], item['start'], str(item['target']), item['alias']))\n            chosen = [ranked[0]]\n            if len(ranked) > 1 and ranked[0]['primary_score'] - ranked[1]['primary_score'] < gap:\n                chosen = [item for item in ranked if ranked[0]['primary_score'] - item['primary_score'] < gap]\n            groups.append({'start': span[0], 'end': span[1], 'length': span[1] - span[0], 'score': ranked[0]['primary_score'], 'matches': chosen})\n        groups.sort(key=lambda item: (-item['score'], -item['length'], item['start'], str(item['matches'][0]['target'])))\n        selected = []\n        occupied = list(exact_spans)\n        for group in groups:\n            span = (group['start'], group['end'])\n            if overlaps(span, occupied):\n                continue\n            selected.append(group)\n            occupied.append(span)\n        selected.sort(key=lambda item: (item['start'], -item['score'], -item['length'], str(item['matches'][0]['target'])))\n        return selected\n\n    def display_hit_text(hit, meta, name):\n        alias = str(hit.get('alias') or '').strip() if isinstance(hit, dict) else ''\n        label = str(meta.get('label') or '').strip() if isinstance(meta, dict) else ''\n        return alias or label or str(name or '')\n\n    def build_select_field_summary(field_hits, composite_hits, context_fields, fallback_used, fallback_message, select_fields):\n        lines = ['字段选择摘要', '', '直接字段命中']\n        if field_hits:\n            for item in field_hits:\n                lines.append('- %s → %s' % (item.get('text') or item.get('field') or '', item.get('field') or ''))\n        else:\n            lines.append('- 无')\n        lines.extend(['', '复合维度命中'])\n        if composite_hits:\n            for item in composite_hits:\n                lines.append('- %s → %s' % (item.get('text') or item.get('composite') or '', item.get('composite') or ''))\n                expand_to = item.get('expand_to') if isinstance(item.get('expand_to'), list) else []\n                lines.append('  → %s' % (', '.join(expand_to) if expand_to else '无'))\n        else:\n            lines.append('- 无')\n        lines.extend(['', '固定补充字段'])\n        lines.append('- %s' % (', '.join(context_fields) if context_fields else '无'))\n        lines.extend(['', '字段兜底'])\n        lines.append('- %s' % (fallback_message if fallback_used else '未触发'))\n        lines.extend(['', '最终SELECT字段'])\n        lines.append('- %s' % (', '.join(select_fields) if select_fields else '无'))\n        return '\\n'.join(lines)\n\n    warnings = []\n\n    where_filters = {}\n    value_alias_hits = {}\n    fuzzy_alias_hits = {}\n    for field in filter_fields:\n        alias_map = value_alias_to_filter.get(field) if isinstance(value_alias_to_filter.get(field), dict) else {}\n        if not alias_map:\n            continue\n        exact_items = find_alias_hit_items(alias_map, q_norm)\n        exact_spans = [(item['start'], item['end']) for item in exact_items]\n        ordered_hits = [(item['start'], 0, item['target']) for item in exact_items]\n        exact_values = unique_targets(exact_items)\n        if exact_values:\n            value_alias_hits[field] = exact_values\n        policy_cfg = match_policies.get(field) if isinstance(match_policies.get(field), dict) else {}\n        fuzzy_policy = policy_cfg.get('fuzzy') if isinstance(policy_cfg.get('fuzzy'), dict) else {}\n        audit_items = []\n        if fuzzy_policy.get('enabled') is True:\n            for group in fuzzy_alias_matches(alias_map, q_norm, exact_spans, fuzzy_policy):\n                matches = group['matches']\n                for rank, match in enumerate(matches):\n                    ordered_hits.append((group['start'], rank + 1, match['target']))\n                if len(matches) == 1:\n                    match = matches[0]\n                    audit_items.append({'input': match['input'], 'alias': match['alias'], 'target': match['target'], 'distance': match['distance'], 'score': round(match['score'], 6), 'mode': match['mode']})\n                else:\n                    audit_items.append({'input': matches[0]['input'], 'matches': [{'alias': match['alias'], 'target': match['target'], 'distance': match['distance'], 'score': round(match['score'], 6), 'mode': match['mode']} for match in matches]})\n                warnings.append({'type': 'fuzzy_alias_correction', 'field': field, 'input': matches[0]['input'], 'targets': [match['target'] for match in matches]})\n        if audit_items:\n            fuzzy_alias_hits[field] = audit_items\n        values = []\n        for _, _, target in sorted(ordered_hits, key=lambda item: (item[0], item[1], str(item[2]))):\n            if target not in values:\n                values.append(target)\n        if values:\n            where_filters[field] = values\n\n    if not where_filters:\n        warnings.append({\n            'type': 'NO_STRUCTURED_FILTER_FOUND',\n            'message': '未命中结构化过滤值，将仅按 SELECT 字段查询；如数据量较大，请补充机型/模组/厂商/平台/设备类型。'\n        })\n\n    combined_aliases = {}\n    for alias, field in field_alias_to_field.items():\n        combined_aliases[alias] = {'kind': 'field', 'name': field}\n    for alias, composite in composite_alias_to_name.items():\n        combined_aliases.setdefault(alias, {'kind': 'composite', 'name': composite})\n\n    alias_hit_items = find_alias_hit_items(combined_aliases, q_norm)\n    alias_targets = unique_targets(alias_hit_items)\n    selected_fields = []\n    selected_composites = []\n    direct_field_hits = []\n    composite_hits = []\n    for item in alias_hit_items:\n        target = item.get('target')\n        if not isinstance(target, dict):\n            continue\n        if target.get('kind') == 'field':\n            field = target.get('name')\n            if field in allowed_fields and field not in selected_fields:\n                selected_fields.append(field)\n                direct_field_hits.append({\n                    'text': display_hit_text(item, field_meta_all.get(field) if isinstance(field_meta_all.get(field), dict) else {}, field),\n                    'field': field,\n                })\n        elif target.get('kind') == 'composite':\n            name = target.get('name')\n            comp = composite_meta.get(name) if isinstance(composite_meta.get(name), dict) else {}\n            if name and name not in selected_composites:\n                selected_composites.append(name)\n                composite_hits.append({\n                    'text': display_hit_text(item, comp, name),\n                    'composite': name,\n                    'expand_to': list(comp.get('expand_to') or []),\n                })\n            for field in comp.get('expand_to') or []:\n                if field in allowed_fields and field not in selected_fields:\n                    selected_fields.append(field)\n\n    context_fields = [f for f in filter_fields if f in allowed_fields]\n    select_fields = []\n    for field in context_fields + selected_fields:\n        if field not in select_fields:\n            select_fields.append(field)\n\n    fallback_used = False\n    fallback_message = '未触发'\n    if not selected_fields:\n        # 无明确指标时给 LLM 更多上下文，但仍限定在 registry 白名单内。\n        fallback_used = True\n        identity = composite_meta.get('identity', {}).get('expand_to') or context_fields\n        for field in identity:\n            if field in allowed_fields and field not in select_fields:\n                select_fields.append(field)\n        warnings.append({'type': 'SELECT_FIELDS_FALLBACK_USED', 'fields': select_fields})\n        fallback_message = '已触发：未命中明确字段，补充 %s' % (', '.join(identity) if identity else '无')\n\n    for field in select_fields + list(where_filters.keys()):\n        if field not in allowed_fields or not valid_identifier(field):\n            return fail('error', 'SQL 字段未通过白名单校验: %s' % field)\n\n    placeholders = []\n    params = []\n    for field in filter_fields:\n        values = where_filters.get(field)\n        if not values:\n            continue\n        part = ','.join(['?'] * len(values))\n        placeholders.append('`%s` IN (%s)' % (field, part))\n        params.extend(values)\n\n    select_sql = ', '.join('`%s`' % field for field in select_fields)\n    sql = 'SELECT %s FROM `%s`' % (select_sql, table)\n    if placeholders:\n        sql += ' WHERE ' + ' AND '.join(placeholders)\n    sql += ' LIMIT ?'\n    params.append(limit)\n\n    selected_field_meta = {}\n    for field in select_fields:\n        selected_field_meta[field] = field_meta_all.get(field) or {'label': field, 'description': ''}\n\n    try:\n        select_field_summary = build_select_field_summary(\n            direct_field_hits,\n            composite_hits,\n            context_fields,\n            fallback_used,\n            fallback_message,\n            select_fields,\n        )\n    except Exception as exc:\n        select_field_summary = '字段选择摘要生成失败：%s' % str(exc)[:120]\n\n    sql_plan = {\n        'status': 'ok',\n        'backend': 'mysql_http',\n        'readonly': True,\n        'table': table,\n        'select_fields': select_fields,\n        'where_filters': where_filters,\n        'where_allowed_fields': filter_fields,\n        'sql': sql,\n        'params': params,\n        'limit': limit,\n        'sql_select_mode': sql_select_mode,\n        'selected_composites': selected_composites,\n        'selected_field_meta': selected_field_meta,\n        'value_alias_hits': value_alias_hits,\n        'fuzzy_alias_hits': fuzzy_alias_hits,\n        'warnings': warnings,\n    }\n\n    return {\n        'jf_sql_plan_json': dump(sql_plan),\n        'jf_sql_compile_status': 'ok',\n        'jf_sql_compile_error_answer': '',\n        'jf_selected_field_meta_json': dump(selected_field_meta),\n        'jf_select_field_summary': select_field_summary,\n    }\n",
            "variables": [
