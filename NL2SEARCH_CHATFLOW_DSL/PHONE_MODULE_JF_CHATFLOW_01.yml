            "source_code": "def main(context_json='', mysql_query_result_json='', jf_selected_field_meta_json='', jf_alias_index_json='', analysis_system_prompt='', analysis_user_prompt='', jf_current_execution_context_json=''):\n    import json\n\n    LOCAL_CONTEXT_TOKENS = 32768\n    LOCAL_MAX_PREDICT_TOKENS = 8192\n    PROMPT_TOKEN_SAFETY_MARGIN = 1024\n    MAX_ESTIMATED_PROMPT_TOKENS = (\n        LOCAL_CONTEXT_TOKENS\n        - LOCAL_MAX_PREDICT_TOKENS\n        - PROMPT_TOKEN_SAFETY_MARGIN\n    )\n\n    def load_json(raw, default):\n        try:\n            obj = json.loads(raw or '')\n            return obj if isinstance(obj, type(default)) else default\n        except Exception:\n            return default\n\n    def dump_compact(obj):\n        return json.dumps(\n            obj,\n            ensure_ascii=False,\n            separators=(',', ':')\n        )\n\n    def estimate_tokens(text):\n        # 保守估算：中日韩字符按 1 token，其余字符约 4 字符/token。\n        cjk_count = 0\n        other_count = 0\n        for char in str(text or ''):\n            code = ord(char)\n            is_cjk = (\n                0x3400 <= code <= 0x4DBF\n                or 0x4E00 <= code <= 0x9FFF\n                or 0xF900 <= code <= 0xFAFF\n                or 0x3040 <= code <= 0x30FF\n                or 0xAC00 <= code <= 0xD7AF\n            )\n            if is_cjk:\n                cjk_count += 1\n            else:\n                other_count += 1\n        return cjk_count + ((other_count + 3) // 4)\n\n    def compact_composite_meta(alias_index, selected_composites, warnings):\n        composite_meta = (\n            alias_index.get('composite_meta')\n            if isinstance(alias_index.get('composite_meta'), dict)\n            else {}\n        )\n        result = {}\n        for composite_id in selected_composites:\n            meta = (\n                composite_meta.get(composite_id)\n                if isinstance(composite_meta.get(composite_id), dict)\n                else {}\n            )\n            if not meta:\n                warnings.append(\n                    'selected composite metadata missing: %s' % composite_id\n                )\n                continue\n            result[composite_id] = {\n                'label': str(meta.get('label') or composite_id),\n                'description': str(meta.get('description') or ''),\n                'expand_to': (\n                    meta.get('expand_to')\n                    if isinstance(meta.get('expand_to'), list)\n                    else []\n                ),\n            }\n        return result\n\n    def compact_sql_plan(plan, alias_index):\n        selected_composites = (\n            plan.get('selected_composites')\n            if isinstance(plan.get('selected_composites'), list)\n            else []\n        )\n        warnings = list(plan.get('warnings')) if isinstance(plan.get('warnings'), list) else []\n        selected_composite_meta = compact_composite_meta(\n            alias_index,\n            selected_composites,\n            warnings\n        )\n        return {\n            'table': plan.get('table'),\n            'select_fields': (\n                plan.get('select_fields')\n                if isinstance(plan.get('select_fields'), list)\n                else []\n            ),\n            'where_filters': (\n                plan.get('where_filters')\n                if isinstance(plan.get('where_filters'), dict)\n                else {}\n            ),\n            'selected_composites': selected_composites,\n            'selected_composite_meta': selected_composite_meta,\n            'warnings': warnings,\n        }\n\n    def compact_field_meta(field_meta, select_fields):\n        result = {}\n        for field in select_fields:\n            meta = (\n                field_meta.get(field)\n                if isinstance(field_meta.get(field), dict)\n                else {}\n            )\n            result[field] = {\n                'label': str(meta.get('label') or field),\n                'description': str(meta.get('description') or ''),\n            }\n        return result\n\n    context = load_json(context_json, {})\n    execution_context = load_json(jf_current_execution_context_json, {})\n    query_result = load_json(mysql_query_result_json, {})\n    raw_field_meta = load_json(jf_selected_field_meta_json, {})\n    alias_index = load_json(jf_alias_index_json, {})\n\n    user_question = str(context.get('question') or '')\n    rows = (\n        query_result.get('rows')\n        if isinstance(query_result.get('rows'), list)\n        else []\n    )\n    raw_sql_plan = (\n        query_result.get('sql_plan')\n        if isinstance(query_result.get('sql_plan'), dict)\n        else {}\n    )\n\n    sql_plan = compact_sql_plan(raw_sql_plan, alias_index)\n    field_meta = compact_field_meta(\n        raw_field_meta,\n        sql_plan.get('select_fields') or []\n    )\n\n    # 交给 LLM 的数据包包含受控查询上下文和本轮真实结果。\n    package = {\n        'user_question': user_question,\n        'previous_user_query': str(execution_context.get('previous_user_query') or ''),\n        'current_user_query': str(execution_context.get('current_user_query') or user_question),\n        'jf_current_execution_context_json': jf_current_execution_context_json,\n        'sql_plan': sql_plan,\n        'field_meta': field_meta,\n        'rows': rows,\n    }\n\n    system_prompt = str(analysis_system_prompt or '').strip()\n    user_prompt_rules = str(analysis_user_prompt or '').strip()\n    if user_prompt_rules:\n        user_prompt_rules += '\\n\\n数据库结果可能包含历史查询产生的候选数据。请结合上一轮问题、当前问题、当前执行上下文和本轮数据库结果，判断用户本轮要查询、分析、总结或对比哪些数据。当前问题优先于上一轮问题。只使用数据库结果中真实存在的数据；历史候选数据不要求全部展示。不得重新生成SQL，不得修改canonical过滤范围，不得捏造缺失数据。\\n'\n\n    if not system_prompt or not user_prompt_rules:\n        missing_prompt_envs = []\n        if not system_prompt:\n            missing_prompt_envs.append('JF_ANALYSIS_SYSTEM_PROMPT')\n        if not user_prompt_rules:\n            missing_prompt_envs.append('JF_ANALYSIS_USER_PROMPT')\n        message = 'LLM_PROMPT_CONFIG_MISSING: ' + ','.join(missing_prompt_envs)\n        payload = {\n            'status': 'error',\n            'llm_task_type': 'mysql_sql_answer',\n            'output_kind': 'text',\n            'artifact_type': 'markdown_text',\n            'query_plan': sql_plan,\n            'query_result': {\n                'row_count': len(rows),\n                'rows_omitted': True,\n            },\n            'error': message,\n        }\n        return {\n            'llm_handler_input_json': dump_compact(payload),\n            'llm_task_type': str(payload.get('llm_task_type') or ''),\n            'llm_output_kind': str(payload.get('output_kind') or ''),\n            'llm_artifact_type': str(payload.get('artifact_type') or ''),\n            'llm_system_prompt': '',\n            'llm_user_prompt': message,\n        }\n\n    user_prompt = (\n        user_prompt_rules\n        + '【输入数据包】\\n'\n        + dump_compact(package)\n    )\n\n    estimated_prompt_tokens = estimate_tokens(\n        system_prompt + '\\n' + user_prompt\n    )\n\n    if estimated_prompt_tokens > MAX_ESTIMATED_PROMPT_TOKENS:\n        payload = {\n            'status': 'error',\n            'llm_task_type': 'mysql_sql_answer',\n            'output_kind': 'text',\n            'artifact_type': 'markdown_text',\n            'system_prompt': system_prompt,\n            'user_prompt': (\n                'LLM_INPUT_TOO_LARGE: SQL 查询结果超过本地模型安全上下文预算，'\n                '请缩小查询范围后重试。'\n            ),\n            'query_plan': sql_plan,\n            'query_result': {\n                'row_count': len(rows),\n                'rows_omitted': True,\n            },\n            'error': 'LLM_INPUT_TOO_LARGE',\n        }\n    else:\n        payload = {\n            'status': 'ok',\n            'llm_task_type': 'mysql_sql_answer',\n            'output_kind': 'text',\n            'artifact_type': 'markdown_text',\n            'query_plan': sql_plan,\n            'query_result': {\n                'row_count': len(rows),\n                'rows': rows,\n            },\n            'handler_context': {\n                'source_node': 'llm_input',\n                'input_fields': [\n                    'user_question',\n                    'sql_plan',\n                    'field_meta',\n                    'rows',\n                ],\n                'estimated_prompt_tokens': estimated_prompt_tokens,\n                'local_context_tokens': LOCAL_CONTEXT_TOKENS,\n                'local_max_predict_tokens': LOCAL_MAX_PREDICT_TOKENS,\n            },\n        }\n\n    return {\n        'llm_handler_input_json': dump_compact(payload),\n        'llm_task_type': str(payload.get('llm_task_type') or ''),\n        'llm_output_kind': str(payload.get('output_kind') or ''),\n        'llm_artifact_type': str(payload.get('artifact_type') or ''),\n        'llm_system_prompt': str(system_prompt),\n        'llm_user_prompt': str(user_prompt),\n    }\n",
            "variables": [
              {
                "variable": "context_json",
                "value_selector": [
