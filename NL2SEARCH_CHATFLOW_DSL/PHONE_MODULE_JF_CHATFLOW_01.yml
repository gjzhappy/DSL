urce = 'local_llm'\n    else:\n        error = full_result.get('error') or 'LLM 未返回有效文本'\n        text = 'LLM 输出生成完成，但模型未返回有效文本。'\n\n    result = {\n        'handler_status': 'ok' if not error else 'error',\n        'output_kind': output_kind,\n        'answer': text,\n        'artifact_type': artifact_type,\n        'artifact_payload_json': json.dumps({'source': source, 'llm_task_type': task_type, 'content': text}, ensure_ascii=False),\n        'query_plan_json': json.dumps(query_plan, ensure_ascii=False),\n        'query_result_json': json.dumps(query_result, ensure_ascii=False),\n        'error': error\n    }\n    encoded = json.dumps(result, ensure_ascii=False)\n    return {\n        'llm_handler_result_json': encoded,\n        'local_llm_result_json': encoded\n    }\n"
