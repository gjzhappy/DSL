            "source_code": "def main(context_json='', jf_capacitor_registry_json='', jf_capacitor_alias_index_json='', jf_capacitor_registry_parse_status='', jf_capacitor_registry_error='', jf_capacitor_query_memory_json=''):\n    import json\n    import re\n    import unicodedata\n\n    def load_json(raw, default):\n        try:\n            obj = json.loads(raw or '')\n            return obj if isinstance(obj, type(default)) else default\n        except Exception:\n            return default\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    def normalize(value):\n        text = unicodedata.normalize('NFKC', str(value or '')).strip().casefold()\n        return re.sub(r'[\\s_\\-]+', '', text)\n\n    def valid_identifier(value):\n        return bool(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', str(value or '')))\n\n    def as_int(value, default):\n        try:\n            n = int(value)\n            return n if n > 0 else default\n        except Exception:\n            return default\n\n    def stable_unique(values):\n        result = []\n        for value in values:\n            if value not in result:\n                result.append(value)\n        return result\n\n    REFERENCE_WORDS = (\n        '它', '它们', '他们', '其', '其余', '这些', '那些',\n        '上述', '前面', '之前', '刚才',\n    )\n    REFERENCE_PHRASES = (\n        '这些平台',\n        '这些电源域',\n        '这些网络',\n        '这些Pin/Net',\n        '这些电容',\n        '上述平台',\n        '上述电源域',\n        '上述网络',\n        '上述Pin/Net',\n        '刚才的网络',\n        '之前的电源域',\n        '这些电容配置',\n    )\n\n    def has_reference_expression(question_norm):\n        # 短语优先；轻量指代只影响 scope 决策，不参与字段/别名解析。\n        if any(normalize(phrase) in question_norm for phrase in REFERENCE_PHRASES):\n            return True\n        return any(normalize(word) in question_norm for word in REFERENCE_WORDS)\n\n    def normalize_semantic_filters(items, allowed_fields, allowed_composites):\n        if not isinstance(items, list):\n            raise ValueError('memory semantic filters invalid')\n        result = []\n        for item in items:\n            if not isinstance(item, dict):\n                raise ValueError('memory semantic filter invalid')\n            target_type, target, operator = item.get('target_type'), item.get('target'), item.get('operator')\n            if operator not in ('exists', 'empty'):\n                raise ValueError('memory semantic operator invalid')\n            if (target_type == 'field' and target not in allowed_fields) or (target_type == 'composite' and target not in allowed_composites):\n                raise ValueError('memory semantic target invalid')\n            if target_type not in ('field', 'composite'):\n                raise ValueError('memory semantic target type invalid')\n            normalized = {'target_type': target_type, 'target': target, 'operator': operator}\n            if normalized not in result:\n                result.append(normalized)\n        return result\n\n    def normalize_scope(scope, allowed_fields, filter_fields, canonical_values, allowed_composites):\n        if not isinstance(scope, dict) or not isinstance(scope.get('where_filters'), dict) or not isinstance(scope.get('select_fields'), list) or not isinstance(scope.get('selected_composites'), list):\n            raise ValueError('scope contract invalid')\n        where = {}\n        for field, values in scope['where_filters'].items():\n            if field not in filter_fields or not isinstance(values, list) or not values:\n                raise ValueError('memory filter invalid')\n            if any(not isinstance(value, str) or value not in canonical_values.get(field, ()) for value in values):\n                raise ValueError('memory canonical value invalid')\n            where[field] = stable_unique(values)\n        selected = stable_unique(scope['select_fields'])\n        if any(not isinstance(field, str) or field not in allowed_fields for field in selected):\n            raise ValueError('memory select field invalid')\n        composites = stable_unique(scope['selected_composites'])\n        if any(not isinstance(name, str) or name not in allowed_composites for name in composites):\n            raise ValueError('memory composite invalid')\n        semantics = normalize_semantic_filters(scope.get('semantic_filters', []), allowed_fields, allowed_composites)\n        return {'source_user_query': str(scope.get('source_user_query') or ''), 'where_filters': where, 'semantic_filters': semantics, 'select_fields': selected, 'selected_composites': composites}\n\n    def safe_parse_query_memory(raw, allowed_fields, filter_fields, canonical_values, allowed_composites):\n        if not raw or str(raw).strip() in ('', 'null', '{}'):\n            return [], '', False\n        try:\n            memory = json.loads(raw)\n            if not isinstance(memory, dict) or memory.get('version') != 'jf_capacitor_query_memory_v1':\n                raise ValueError('memory envelope invalid')\n            raw_scope = memory.get('last_scope')\n            # 只为读取已部署的 v1 记忆保留旧 query_scopes 兼容入口。\n            if raw_scope is None and isinstance(memory.get('query_scopes'), list) and memory['query_scopes']:\n                raw_scope = memory['query_scopes'][-1]\n            if raw_scope is None:\n                return [], str(memory.get('current_user_query') or ''), False\n            scope = normalize_scope(raw_scope, allowed_fields, filter_fields, canonical_values, allowed_composites)\n            return [scope], str(memory.get('current_user_query') or ''), False\n        except Exception:\n            return [], '', True\n\n    def resolve_query_scope(history, question, behavior, where_filters, semantic_filters, select_fields, selected_composites):\n        base = history[-1] if history and behavior in ('inherit', 'extend') else {}\n        effective_where = dict(base.get('where_filters') or {})\n        effective_semantics = list(base.get('semantic_filters') or [])\n        if behavior == 'reset':\n            effective_where = dict(where_filters)\n            effective_semantics = list(semantic_filters)\n        elif behavior == 'extend':\n            effective_where.update(where_filters)\n            for item in semantic_filters:\n                if item not in effective_semantics:\n                    effective_semantics.append(item)\n        effective = {\n            'source_user_query': question,\n            'where_filters': effective_where,\n            'semantic_filters': effective_semantics,\n            'select_fields': list(select_fields),\n            'selected_composites': list(selected_composites),\n        }\n        return effective\n\n    def compile_scoped_where(scopes, filter_fields):\n        clauses, params, seen = [], [], []\n        for scope in scopes:\n            signature = tuple((field, tuple(scope['where_filters'].get(field) or [])) for field in filter_fields if scope['where_filters'].get(field))\n            if not signature or signature in seen:\n                continue\n            seen.append(signature)\n            parts = []\n            for field, values in signature:\n                parts.append('`%s` IN (%s)' % (field, ','.join(['?'] * len(values))))\n                params.extend(values)\n            clauses.append('(' + ' AND '.join(parts) + ')')\n        return clauses, params\n\n    def parse_presence_filters(question_norm, alias_hits, allowed_fields, allowed_composites):\n        # 通用存在性语义属于 Query Parser；Registry 仍仅提供字段和 composite 别名。\n        empty_words = ('不存在', '未提供', '没有', '缺少', '为空', '空值', '无')\n        exists_words = ('不为空', '存在', '具备', '拥有', '带有', '包含', '非空', '有值', '有')\n        filters = []\n        consumed_operator_positions = set()\n        for hit in alias_hits:\n            target = hit.get('target') if isinstance(hit, dict) else None\n            if not isinstance(target, dict) or target.get('kind') not in ('field', 'composite'):\n                continue\n            target_type = target.get('kind')\n            name = target.get('name')\n            if (target_type == 'field' and name not in allowed_fields) or (target_type == 'composite' and name not in allowed_composites):\n                continue\n            left = question_norm[max(0, hit['start'] - 4):hit['start']]\n            right = question_norm[hit['end']:hit['end'] + 4]\n            candidates = []\n            for operator, words in (('empty', empty_words), ('exists', exists_words)):\n                for word in words:\n                    if right.startswith(word):\n                        candidates.append((operator, hit['end'], 0, -len(word)))\n                    if left.endswith(word):\n                        candidates.append((operator, hit['start'] - len(word), 1, -len(word)))\n            # 同侧短语按长度优先，避免“不为空”降级命中“为空”、\n            # “不存在”降级命中“存在”。\n            candidates.sort(key=lambda item: (item[2], item[3], 0 if item[0] == 'empty' else 1))\n            chosen = next((item for item in candidates if item[1] not in consumed_operator_positions), None)\n            if right.startswith('有哪些'):\n                chosen = None\n            if chosen:\n                semantic_filter = {'target_type': target_type, 'target': name, 'operator': chosen[0]}\n                if semantic_filter not in filters:\n                    filters.append(semantic_filter)\n                    consumed_operator_positions.add(chosen[1])\n        return filters\n\n    def compile_presence_where(filters, composite_meta, allowed_fields):\n        clauses = []\n        for item in filters:\n            operator = item.get('operator')\n            target_type = item.get('target_type')\n            target = item.get('target')\n            if target_type == 'composite':\n                meta = composite_meta.get(target) if isinstance(composite_meta.get(target), dict) else {}\n                fields = [field for field in meta.get('expand_to') or [] if field in allowed_fields and valid_identifier(field)]\n            elif target_type == 'field' and target in allowed_fields and valid_identifier(target):\n                fields = [target]\n            else:\n                fields = []\n            field_clauses = []\n            for field in fields:\n                if operator == 'exists':\n                    field_clauses.append(\"(`%s` IS NOT NULL AND `%s` != '')\" % (field, field))\n                elif operator == 'empty':\n                    field_clauses.append(\"(`%s` IS NULL OR `%s` = '')\" % (field, field))\n            if field_clauses:\n                joiner = ' OR ' if operator == 'exists' else ' AND '\n                clauses.append('(' + joiner.join(field_clauses) + ')')\n        return clauses\n\n    def fail(status, message):\n        payload = {\n            'status': status,\n            'backend': 'mysql_http',\n            'readonly': True,\n            'error': message,\n        }\n        return {\n            'jf_capacitor_sql_plan_json': dump(payload),\n            'jf_capacitor_sql_compile_status': status,\n            'jf_capacitor_sql_compile_error_answer': 'JF电容对比 SQL 查询计划生成失败，原因：%s' % message,\n            'jf_capacitor_selected_field_meta_json': '{}',\n            'jf_capacitor_select_field_summary': '',\n            'jf_capacitor_current_execution_context_json': '{}',\n            'jf_capacitor_memory_write_ready': False,\n        }\n\n    if str(jf_capacitor_registry_parse_status or '') != 'ok':\n        return fail(str(jf_capacitor_registry_parse_status or 'error'), jf_capacitor_registry_error or 'JF电容对比 registry 未成功解析。')\n\n    ctx = load_json(context_json, {})\n    registry = load_json(jf_capacitor_registry_json, {})\n    alias_index = load_json(jf_capacitor_alias_index_json, {})\n\n    question = str(ctx.get('question') or '')\n    table = str(registry.get('table') or '').strip()\n    fields = registry.get('fields') if isinstance(registry.get('fields'), dict) else {}\n    query_roles = registry.get('query_roles') if isinstance(registry.get('query_roles'), dict) else {}\n    sql_filter_fields = query_roles.get('sql_filter_fields') if isinstance(query_roles.get('sql_filter_fields'), list) else []\n    sql_select_mode = query_roles.get('sql_select_fields') or 'all_fields'\n    normalized_question = unicodedata.normalize('NFKC', question)\n    result_limit_match = re.search(\n        r'(?:只看|仅看|只返回|仅返回|返回|最多返回|给我|限制(?:为|到)?|只查询|仅查询|查询|仅显示|只显示|显示|只取|仅取)\\s*(?:前\\s*)?(\\d+)\\s*(?:条(?:数据|结果)?|个结果|行(?:数据)?)',\n        normalized_question,\n    )\n    ranking_intent = re.search(\n        r'(?i)top\\s*\\d+|最高|最低|最大|最小|最少|排名|排行|(?:前|后)\\s*\\d+\\s*名|第\\s*\\d+',\n        normalized_question,\n    )\n    limit = as_int(result_limit_match.group(1), None) if result_limit_match and not ranking_intent else None\n\n    if not question.strip():\n        return fail('error', '用户问题为空。')\n    if not table or not valid_identifier(table):\n        return fail('error', 'registry.table 缺失或非法。')\n    if not fields:\n        return fail('error', 'registry.fields 为空。')\n\n    allowed_fields = set(fields.keys())\n    filter_fields = [f for f in sql_filter_fields if f in allowed_fields]\n    if not filter_fields:\n        return fail('error', 'query_roles.sql_filter_fields 为空或均无效。')\n\n    canonical_values = {}\n    registry_value_aliases = registry.get('value_aliases') if isinstance(registry.get('value_aliases'), dict) else {}\n    for field in filter_fields:\n        definitions = registry_value_aliases.get(field) if isinstance(registry_value_aliases.get(field), dict) else {}\n        canonical_values[field] = tuple(definitions.keys())\n    history_scopes, previous_user_query, memory_invalid = safe_parse_query_memory(jf_capacitor_query_memory_json, allowed_fields, filter_fields, canonical_values, set((registry.get('composite_fields') or {}).keys()))\n\n    field_alias_to_field = alias_index.get('field_alias_to_field') if isinstance(alias_index.get('field_alias_to_field'), dict) else {}\n    composite_alias_to_name = alias_index.get('composite_alias_to_name') if isinstance(alias_index.get('composite_alias_to_name'), dict) else {}\n    value_alias_to_filter = alias_index.get('value_alias_to_filter') if isinstance(alias_index.get('value_alias_to_filter'), dict) else {}\n    field_meta_all = alias_index.get('field_meta') if isinstance(alias_index.get('field_meta'), dict) else {}\n    composite_meta = alias_index.get('composite_meta') if isinstance(alias_index.get('composite_meta'), dict) else {}\n    match_policies = registry.get('match_policies') if isinstance(registry.get('match_policies'), dict) else {}\n\n    q_norm = normalize(question)\n\n    def find_alias_hit_items(alias_map, text_norm):\n        candidates = []\n        for alias, target in alias_map.items():\n            alias_text = normalize(alias)\n            if not alias_text:\n                continue\n            start = 0\n            while True:\n                idx = text_norm.find(alias_text, start)\n                if idx < 0:\n                    break\n                candidates.append({\n                    'alias': alias_text,\n                    'target': target,\n                    'start': idx,\n                    'end': idx + len(alias_text),\n                    'length': len(alias_text),\n                })\n                start = idx + 1\n        candidates.sort(key=lambda x: (-x['length'], x['start'], str(x['target'])))\n        selected = []\n        occupied = []\n        for item in candidates:\n            span = (item['start'], item['end'])\n            if any(span[0] < used[1] and used[0] < span[1] for used in occupied):\n                continue\n            selected.append(item)\n            occupied.append(span)\n        selected.sort(key=lambda x: (x['start'], -x['length'], str(x['target'])))\n        return selected\n\n    def unique_targets(items):\n        values = []\n        for item in items:\n            if item['target'] not in values:\n                values.append(item['target'])\n        return values\n\n    def overlaps(span, occupied):\n        return any(span[0] < used[1] and used[0] < span[1] for used in occupied)\n\n    def damerau_levenshtein(left, right, cutoff):\n        if abs(len(left) - len(right)) > cutoff:\n            return cutoff + 1\n        previous_previous = None\n        previous = list(range(len(right) + 1))\n        for i, left_char in enumerate(left, 1):\n            current = [i]\n            for j, right_char in enumerate(right, 1):\n                value = min(current[j - 1] + 1, previous[j] + 1, previous[j - 1] + (left_char != right_char))\n                if previous_previous is not None and i > 1 and j > 1 and left_char == right[j - 2] and left[i - 2] == right_char:\n                    value = min(value, previous_previous[j - 2] + 1)\n                current.append(value)\n            previous_previous, previous = previous, current\n        return previous[-1]\n\n    def protected_occurrences(text, protected_tokens):\n        occupied = []\n        found = []\n        for token in sorted(set(protected_tokens), key=lambda item: (-len(item), item)):\n            start = 0\n            while True:\n                index = text.find(token, start)\n                if index < 0:\n                    break\n                span = (index, index + len(token))\n                if not overlaps(span, occupied):\n                    found.append({'token': token, 'start': span[0], 'end': span[1]})\n                    occupied.append(span)\n                start = index + 1\n        return sorted(found, key=lambda item: (item['start'], item['end'], item['token']))\n\n    def protected_signature(text, protected_tokens):\n        return tuple(item['token'] for item in protected_occurrences(text, protected_tokens))\n\n    def fuzzy_alias_matches(alias_map, text_norm, exact_spans, policy):\n        rules = sorted(policy.get('distance_rules') or [], key=lambda rule: rule['max_length'])\n        protected_tokens = [normalize(token) for token in policy.get('protected_tokens') or []]\n        token_fuzzy = policy.get('protected_token_fuzzy') if isinstance(policy.get('protected_token_fuzzy'), dict) else {}\n        token_fuzzy_enabled = token_fuzzy.get('enabled') is True\n        configured_token_distance = token_fuzzy.get('max_distance', 0)\n        min_length = policy['min_alias_length']\n        gap = float(policy['min_score_gap'])\n        require_digits = policy.get('require_same_digits') is True\n        require_tokens = policy.get('require_protected_tokens_equal') is True\n        prepared = []\n        for alias, target in alias_map.items():\n            alias_text = normalize(alias)\n            if len(alias_text) < min_length:\n                continue\n            rule = next((item for item in rules if len(alias_text) <= item['max_length']), None)\n            if rule is None:\n                continue\n            alias_digits = re.findall(r'\\d+', alias_text)\n            if require_digits and not alias_digits:\n                continue\n            occurrences = protected_occurrences(alias_text, protected_tokens)\n            prepared.append((alias_text, target, rule['max_distance'], alias_digits, occurrences))\n\n        distance_cache = {}\n        signature_cache = {}\n        mapping_cache = {}\n        core_cache = {}\n\n        def distance(left, right, cutoff):\n            key = (left, right, cutoff)\n            if key not in distance_cache:\n                distance_cache[key] = damerau_levenshtein(left, right, cutoff)\n            return distance_cache[key]\n\n        def map_protected(fragment, alias_text, alias_occurrences, max_distance):\n            key = (fragment, alias_text, tuple((x['token'], x['start'], x['end']) for x in alias_occurrences), max_distance, configured_token_distance)\n            if key in mapping_cache:\n                return mapping_cache[key]\n            choices = []\n            for occurrence in alias_occurrences:\n                token = occurrence['token']\n                token_limit = 0 if len(token) < 3 else configured_token_distance\n                expected = occurrence['start']\n                candidates = []\n                for start in range(max(0, expected - max_distance), min(len(fragment), expected + max_distance) + 1):\n                    for length in range(max(1, len(token) - token_limit), len(token) + token_limit + 1):\n                        end = start + length\n                        if end > len(fragment):\n                            continue\n                        local_distance = distance(fragment[start:end], token, token_limit)\n                        if local_distance <= token_limit:\n                            candidates.append((local_distance, abs(start - expected), abs(length - len(token)), start, end))\n                candidates.sort()\n                choices.append(candidates)\n            best = None\n            def visit(index, previous_end, mapped):\n                nonlocal best\n                if index == len(choices):\n                    rank = tuple(value for item in mapped for value in item[:4])\n                    if best is None or rank < best[0]:\n                        best = (rank, list(mapped))\n                    return\n                for candidate in choices[index]:\n                    if candidate[3] < previous_end:\n                        continue\n                    visit(index + 1, candidate[4], mapped + [candidate])\n            visit(0, 0, [])\n            mapping_cache[key] = best[1] if best else None\n            return mapping_cache[key]\n\n        by_span = {}\n        for alias_text, target, max_distance, alias_digits, alias_occurrences in prepared:\n            alias_tokens = tuple(item['token'] for item in alias_occurrences)\n            for window_length in range(max(1, len(alias_text) - max_distance), len(alias_text) + max_distance + 1):\n                for start in range(0, len(text_norm) - window_length + 1):\n                    span = (start, start + window_length)\n                    if overlaps(span, exact_spans):\n                        continue\n                    fragment = text_norm[start:span[1]]\n                    overall_distance = distance(fragment, alias_text, max_distance)\n                    if overall_distance > max_distance:\n                        continue\n                    signatures = signature_cache.setdefault(span, (re.findall(r'\\d+', fragment), protected_signature(fragment, protected_tokens)))\n                    if require_digits and signatures[0] != alias_digits:\n                        continue\n                    score = 1.0 - float(overall_distance) / max(len(fragment), len(alias_text))\n                    mode = None\n                    primary_score = score\n                    if not require_tokens or signatures[1] == alias_tokens:\n                        mode = 'overall'\n                    elif token_fuzzy_enabled and require_tokens and alias_occurrences:\n                        mapped = map_protected(fragment, alias_text, alias_occurrences, max_distance)\n                        if mapped is not None:\n                            alias_spans = [(item['start'], item['end']) for item in alias_occurrences]\n                            fragment_spans = [(item[3], item[4]) for item in mapped]\n                            alias_core = ''.join(char for index, char in enumerate(alias_text) if not any(left <= index < right for left, right in alias_spans))\n                            fragment_core = ''.join(char for index, char in enumerate(fragment) if not any(left <= index < right for left, right in fragment_spans))\n                            core_key = (fragment_core, alias_core, max_distance)\n                            if core_key not in core_cache:\n                                core_cache[core_key] = distance(fragment_core, alias_core, max_distance)\n                            core_distance = core_cache[core_key]\n                            token_distance_sum = sum(item[0] for item in mapped)\n                            if core_distance + token_distance_sum <= max_distance:\n                                mode = 'segmented'\n                    if mode is None:\n                        continue\n                    candidate = {'input': fragment, 'alias': alias_text, 'target': target, 'distance': overall_distance, 'score': score, 'primary_score': primary_score, 'mode': mode, 'start': start, 'end': span[1], 'length': window_length}\n                    current = by_span.setdefault(span, {}).get(target)\n                    rank = (-primary_score, overall_distance, -window_length, start, str(target), alias_text)\n                    current_rank = (-current['primary_score'], current['distance'], -current['length'], current['start'], str(current['target']), current['alias']) if current else None\n                    if current is None or rank < current_rank:\n                        by_span[span][target] = candidate\n        groups = []\n        for span, canonical_map in by_span.items():\n            ranked = sorted(canonical_map.values(), key=lambda item: (-item['primary_score'], item['distance'], -item['length'], item['start'], str(item['target']), item['alias']))\n            chosen = [ranked[0]]\n            if len(ranked) > 1 and ranked[0]['primary_score'] - ranked[1]['primary_score'] < gap:\n                chosen = [item for item in ranked if ranked[0]['primary_score'] - item['primary_score'] < gap]\n            groups.append({'start': span[0], 'end': span[1], 'length': span[1] - span[0], 'score': ranked[0]['primary_score'], 'matches': chosen})\n        groups.sort(key=lambda item: (-item['score'], -item['length'], item['start'], str(item['matches'][0]['target'])))\n        selected = []\n        occupied = list(exact_spans)\n        for group in groups:\n            span = (group['start'], group['end'])\n            if overlaps(span, occupied):\n                continue\n            selected.append(group)\n            occupied.append(span)\n        selected.sort(key=lambda item: (item['start'], -item['score'], -item['length'], str(item['matches'][0]['target'])))\n        return selected\n\n    def display_hit_text(hit, meta, name):\n        alias = str(hit.get('alias') or '').strip() if isinstance(hit, dict) else ''\n        label = str(meta.get('label') or '').strip() if isinstance(meta, dict) else ''\n        return alias or label or str(name or '')\n\n    def build_select_field_summary(field_hits, composite_hits, context_fields, fallback_used, fallback_message, select_fields):\n        lines = ['字段选择摘要', '', '直接字段命中']\n        if field_hits:\n            for item in field_hits:\n                lines.append('- %s → %s' % (item.get('text') or item.get('field') or '', item.get('field') or ''))\n        else:\n            lines.append('- 无')\n        lines.extend(['', '复合维度命中'])\n        if composite_hits:\n            for item in composite_hits:\n                lines.append('- %s → %s' % (item.get('text') or item.get('composite') or '', item.get('composite') or ''))\n                expand_to = item.get('expand_to') if isinstance(item.get('expand_to'), list) else []\n                lines.append('  → %s' % (', '.join(expand_to) if expand_to else '无'))\n        else:\n            lines.append('- 无')\n        lines.extend(['', '固定补充字段'])\n        lines.append('- %s' % (', '.join(context_fields) if context_fields else '无'))\n        lines.extend(['', '字段兜底'])\n        lines.append('- %s' % (fallback_message if fallback_used else '未触发'))\n        lines.extend(['', '最终SELECT字段'])\n        lines.append('- %s' % (', '.join(select_fields) if select_fields else '无'))\n        return '\\n'.join(lines)\n\n    warnings = []\n    if memory_invalid:\n        warnings.append({'type': 'QUERY_MEMORY_INVALID_IGNORED', 'message': '非法查询记忆已忽略。'})\n\n    where_filters = {}\n    value_alias_hits = {}\n    fuzzy_alias_hits = {}\n    for field in filter_fields:\n        alias_map = value_alias_to_filter.get(field) if isinstance(value_alias_to_filter.get(field), dict) else {}\n        if not alias_map:\n            continue\n        exact_items = find_alias_hit_items(alias_map, q_norm)\n        exact_spans = [(item['start'], item['end']) for item in exact_items]\n        ordered_hits = [(item['start'], 0, item['target']) for item in exact_items]\n        exact_values = unique_targets(exact_items)\n        if exact_values:\n            value_alias_hits[field] = exact_values\n        policy_cfg = match_policies.get(field) if isinstance(match_policies.get(field), dict) else {}\n        fuzzy_policy = policy_cfg.get('fuzzy') if isinstance(policy_cfg.get('fuzzy'), dict) else {}\n        audit_items = []\n        if fuzzy_policy.get('enabled') is True:\n            for group in fuzzy_alias_matches(alias_map, q_norm, exact_spans, fuzzy_policy):\n                matches = group['matches']\n                for rank, match in enumerate(matches):\n                    ordered_hits.append((group['start'], rank + 1, match['target']))\n                if len(matches) == 1:\n                    match = matches[0]\n                    audit_items.append({'input': match['input'], 'alias': match['alias'], 'target': match['target'], 'distance': match['distance'], 'score': round(match['score'], 6), 'mode': match['mode']})\n                else:\n                    audit_items.append({'input': matches[0]['input'], 'matches': [{'alias': match['alias'], 'target': match['target'], 'distance': match['distance'], 'score': round(match['score'], 6), 'mode': match['mode']} for match in matches]})\n                warnings.append({'type': 'fuzzy_alias_correction', 'field': field, 'input': matches[0]['input'], 'targets': [match['target'] for match in matches]})\n        if audit_items:\n            fuzzy_alias_hits[field] = audit_items\n        values = []\n        for _, _, target in sorted(ordered_hits, key=lambda item: (item[0], item[1], str(item[2]))):\n            if target not in values:\n                values.append(target)\n        if values:\n            where_filters[field] = values\n\n    combined_aliases = {}\n    for alias, field in field_alias_to_field.items():\n        combined_aliases[alias] = {'kind': 'field', 'name': field}\n    for alias, composite in composite_alias_to_name.items():\n        combined_aliases.setdefault(alias, {'kind': 'composite', 'name': composite})\n\n    alias_hit_items = find_alias_hit_items(combined_aliases, q_norm)\n    alias_targets = unique_targets(alias_hit_items)\n    semantic_filters = parse_presence_filters(q_norm, alias_hit_items, allowed_fields, set(composite_meta.keys()))\n    selected_fields = []\n    selected_composites = []\n    direct_field_hits = []\n    composite_hits = []\n    for item in alias_hit_items:\n        target = item.get('target')\n        if not isinstance(target, dict):\n            continue\n        if target.get('kind') == 'field':\n            field = target.get('name')\n            if field in allowed_fields and field not in selected_fields:\n                selected_fields.append(field)\n                direct_field_hits.append({\n                    'text': display_hit_text(item, field_meta_all.get(field) if isinstance(field_meta_all.get(field), dict) else {}, field),\n                    'field': field,\n                })\n        elif target.get('kind') == 'composite':\n            name = target.get('name')\n            comp = composite_meta.get(name) if isinstance(composite_meta.get(name), dict) else {}\n            if name and name not in selected_composites:\n                selected_composites.append(name)\n                composite_hits.append({\n                    'text': display_hit_text(item, comp, name),\n                    'composite': name,\n                    'expand_to': list(comp.get('expand_to') or []),\n                })\n            for field in comp.get('expand_to') or []:\n                if field in allowed_fields and field not in selected_fields:\n                    selected_fields.append(field)\n\n    reference_expression = has_reference_expression(q_norm)\n    query_scope_behavior = 'extend' if reference_expression and (where_filters or semantic_filters) else ('inherit' if reference_expression else 'reset')\n    query_intent_meta = {'query_scope_behavior': query_scope_behavior, 'has_reference_expression': reference_expression}\n\n    context_fields = [f for f in filter_fields if f in allowed_fields]\n    has_explicit_select = bool(selected_fields or selected_composites)\n    inherited_select_fields = history_scopes[-1]['select_fields'] if history_scopes and query_scope_behavior in ('inherit', 'extend') and not has_explicit_select else []\n    inherited_composites = history_scopes[-1]['selected_composites'] if history_scopes and query_scope_behavior in ('inherit', 'extend') and not has_explicit_select else []\n    effective_selected_composites = selected_composites if has_explicit_select else inherited_composites\n    select_fields = stable_unique(context_fields + (selected_fields if has_explicit_select else inherited_select_fields))\n\n    fallback_used = False\n    fallback_message = '未触发'\n    if not has_explicit_select and not (history_scopes and query_scope_behavior in ('inherit', 'extend')):\n        # 无明确指标时给 LLM 更多上下文，但仍限定在 registry 白名单内。\n        fallback_used = True\n        identity = composite_meta.get('identity', {}).get('expand_to') or context_fields\n        for field in identity:\n            if field in allowed_fields and field not in select_fields:\n                select_fields.append(field)\n        warnings.append({'type': 'SELECT_FIELDS_FALLBACK_USED', 'fields': select_fields})\n        fallback_message = '已触发：未命中明确字段，补充 %s' % (', '.join(identity) if identity else '无')\n\n    for field in select_fields + list(where_filters.keys()) + [item['target'] for item in semantic_filters if item.get('target_type') == 'field']:\n        if field not in allowed_fields or not valid_identifier(field):\n            return fail('error', 'SQL 字段未通过白名单校验: %s' % field)\n\n    current_query_delta = {'current_user_query': question, 'explicit_where_filters': where_filters, 'explicit_semantic_filters': semantic_filters, 'explicit_select_fields': selected_fields, 'explicit_selected_composites': selected_composites}\n    effective_scope = resolve_query_scope(history_scopes, question, query_scope_behavior, where_filters, semantic_filters, select_fields, effective_selected_composites)\n    query_scopes = [effective_scope]\n    placeholders, params = compile_scoped_where(query_scopes, filter_fields)\n    presence_clauses = compile_presence_where(effective_scope['semantic_filters'], composite_meta, allowed_fields)\n    if not placeholders and not presence_clauses:\n        warnings.append({\n            'type': 'NO_STRUCTURED_FILTER_FOUND',\n            'message': \"未命中已配置的厂商/平台标准值过滤；请在分析阶段依据rows中的电源域、Pin/Net和电感字段精确筛选，不得按网络名称猜测分类。\"\n        })\n    select_sql = ', '.join('`%s`' % field for field in select_fields)\n    sql = 'SELECT %s FROM `%s`' % (select_sql, table)\n    where_parts = []\n    if placeholders:\n        where_parts.append('(' + ' OR '.join(placeholders) + ')')\n    where_parts.extend(presence_clauses)\n    if where_parts:\n        sql += ' WHERE ' + ' AND '.join(where_parts)\n    if limit is not None:\n        sql += ' LIMIT ?'\n        params.append(limit)\n    # Planner 的解释元数据不进入长期记忆；仅写入最终有效 scope。\n    execution_context = {'version': 'jf_capacitor_query_memory_v1', 'previous_user_query': previous_user_query, 'current_user_query': question, 'last_scope': effective_scope}\n    memory_write_ready = bool(effective_scope['where_filters'] or effective_scope['semantic_filters'] or selected_fields or selected_composites)\n\n    selected_field_meta = {}\n    for field in select_fields:\n        selected_field_meta[field] = field_meta_all.get(field) or {'label': field, 'description': ''}\n\n    try:\n        select_field_summary = build_select_field_summary(\n            direct_field_hits,\n            composite_hits,\n            context_fields,\n            fallback_used,\n            fallback_message,\n            select_fields,\n        )\n    except Exception as exc:\n        select_field_summary = '字段选择摘要生成失败：%s' % str(exc)[:120]\n\n    sql_plan = {\n        'status': 'ok',\n        'backend': 'mysql_http',\n        'readonly': True,\n        'table': table,\n        'select_fields': select_fields,\n        'where_filters': effective_scope['where_filters'],\n        'semantic_filters': effective_scope['semantic_filters'],\n        'query_intent_meta': query_intent_meta,\n        'query_scopes': query_scopes,\n        'current_query_delta': current_query_delta,\n        'where_allowed_fields': filter_fields,\n        'sql': sql,\n        'params': params,\n        'limit': limit,\n        'sql_select_mode': sql_select_mode,\n        'selected_composites': effective_selected_composites,\n        'selected_field_meta': selected_field_meta,\n        'value_alias_hits': value_alias_hits,\n        'fuzzy_alias_hits': fuzzy_alias_hits,\n        'warnings': warnings,\n    }\n\n    return {\n        'jf_capacitor_sql_plan_json': dump(sql_plan),\n        'jf_capacitor_sql_compile_status': 'ok',\n        'jf_capacitor_sql_compile_error_answer': '',\n        'jf_capacitor_selected_field_meta_json': dump(selected_field_meta),\n        'jf_capacitor_select_field_summary': select_field_summary,\n        'jf_capacitor_current_execution_context_json': dump(execution_context),\n        'jf_capacitor_memory_write_ready': bool(memory_write_ready),\n    }\n",
