        {
          "id": "jf_capacitor_registry_parse",
          "type": "custom",
          "data": {
            "title": "解析JF电容对比查询规则",
            "type": "code",
            "outputs": {
              "jf_capacitor_registry_json": {
                "type": "string"
              },
              "jf_capacitor_alias_index_json": {
                "type": "string"
              },
              "jf_capacitor_registry_parse_status": {
                "type": "string"
              },
              "jf_capacitor_registry_warnings_json": {
                "type": "string"
              },
              "jf_capacitor_registry_error": {
                "type": "string"
              }
