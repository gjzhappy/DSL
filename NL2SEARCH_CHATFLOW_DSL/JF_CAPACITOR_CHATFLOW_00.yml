        "value": "{\"version\":\"1.0\",\"table\":\"sn_pisi_jf_capacitor_comparisons_wide\",\"query_roles\":{\"sql_filter_fields\":[\"manufacturer\",\"platform\",\"power_domain\",\"pin_net_name\",\"inductor\"],\"sql_select_fields\":\"all_fields\"},\"fields\":{\"manufacturer\":{\"label\":\"厂商\",\"description\":\"电容对比数据所属厂商。\",\"aliases\":[\"厂商\",\"厂商名称\",\"制造商\",\"品牌\",\"manufacturer\"]},\"platform\":{\"label\":\"平台\",\"description\":\"电容对比数据所属芯片或产品平台。\",\"aliases\":[\"平台\",\"平台名称\",\"芯片平台\",\"platform\"]},\"power_domain\":{\"label\":\"电源域\",\"description\":\"电容对比记录所属的电源域。\",\"aliases\":[\"电源域\",\"供电域\",\"power domain\"]},\"pin_net_name\":{\"label\":\"Pin/Net名称\",\"description\":\"电容对比记录关联的Pin或Net名称，按源数据原样保留。\",\"aliases\":[\"Pin/Net\",\"Pin Net\",\"Pin名称\",\"Net名称\",\"引脚名\",\"网络名\",\"引脚网络\",\"pin name/net name\",\"pin name/net   name\",\"引脚名/网络名\"]},\"inductor\":{\"label\":\"电感\",\"description\":\"该电源域或网络关联的电感信息，按源数据原样保留。\",\"aliases\":[\"电感\",\"电感值\",\"电感规格\",\"inductor\"]},\"near_capacitor\":{\"label\":\"近端电容\",\"description\":\"近端电容配置或规格原始内容。\",\"aliases\":[\"近端电容\",\"近端电容规格\",\"近端电容配置\",\"near capacitor\"]},\"far_capacitor\":{\"label\":\"远端电容\",\"description\":\"远端电容配置或规格原始内容。\",\"aliases\":[\"远端电容\",\"远端电容规格\",\"远端电容配置\",\"far capacitor\"]},\"far_total_capacitance\":{\"label\":\"远端总容值\",\"description\":\"远端电容总容值，单位以源数据实际记录为准。\",\"aliases\":[\"远端总容值\",\"远端总容量\",\"远端总电容值\",\"far total capacitance\"]},\"near_cap_count\":{\"label\":\"近端电容数量\",\"description\":\"近端电容数量。\",\"aliases\":[\"近端电容数量\",\"近端电容个数\",\"近端电容数\",\"near cap count\"]},\"far_cap_count\":{\"label\":\"远端电容数量\",\"description\":\"远端电容数量。\",\"aliases\":[\"远端电容数量\",\"远端电容个数\",\"远端电容数\",\"far cap count\"]},\"far_0402_regular\":{\"label\":\"远端0402普通电容数量\",\"description\":\"远端0402普通电容数量。\",\"aliases\":[\"远端0402普通电容\",\"远端0402普通电容数量\",\"远端0402普通电容个数\",\"far 0402 regular\"]},\"far_0402_three_terminal\":{\"label\":\"远端0402三端子电容数量\",\"description\":\"远端0402三端子电容数量。\",\"aliases\":[\"远端0402三端子电容\",\"远端0402三端子电容数量\",\"远端0402三端子\",\"far 0402 three terminal\"]},\"far_0201_regular\":{\"label\":\"远端0201普通电容数量\",\"description\":\"远端0201普通电容数量。\",\"aliases\":[\"远端0201普通电容\",\"远端0201普通电容数量\",\"远端0201普通电容个数\",\"far 0201 regular\"]},\"far_cap_area_mm2\":{\"label\":\"远端电容面积(mm²)\",\"description\":\"远端电容面积，字段名标明单位为mm²。\",\"aliases\":[\"远端电容面积(mm^2)\",\"远端电容面积（mm^2）\",\"远端电容面积(mm²)\",\"远端电容面积\",\"远端电容面积（mm2）\",\"远端电容占板面积\",\"far capacitor area\",\"far_cap_area_mm2\"]},\"total_cap_area_mm2\":{\"label\":\"总电容面积(mm²)\",\"description\":\"总电容面积，字段名标明单位为mm²。\",\"aliases\":[\"总电容面积(mm^2)\",\"总电容面积（mm^2）\",\"总电容面积(mm²)\",\"总电容面积\",\"总电容面积（mm2）\",\"电容总面积\",\"电容总占板面积\",\"total capacitor area\",\"total_cap_area_mm2\"]},\"remark\":{\"label\":\"备注\",\"description\":\"电容对比记录的备注或补充说明。\",\"aliases\":[\"备注\",\"说明\",\"补充说明\",\"remark\",\"notes\"]}},\"composite_fields\":{\"identity\":{\"label\":\"电容对比对象基础信息\",\"description\":\"定位厂商、平台、电源域、Pin/Net和电感。\",\"aliases\":[\"基础信息\",\"电容对比对象\",\"电源域和网络信息\"],\"expand_to\":[\"manufacturer\",\"platform\",\"power_domain\",\"pin_net_name\",\"inductor\"]},\"capacitor_comparison\":{\"label\":\"电容对比\",\"description\":\"电容对比记录的完整业务字段集合。\",\"aliases\":[\"电容对比\",\"电容比较\",\"电容对比数据\",\"电容明细\"],\"expand_to\":[\"power_domain\",\"pin_net_name\",\"inductor\",\"near_capacitor\",\"far_capacitor\",\"far_total_capacitance\",\"near_cap_count\",\"far_cap_count\",\"far_0402_regular\",\"far_0402_three_terminal\",\"far_0201_regular\",\"far_cap_area_mm2\",\"total_cap_area_mm2\",\"remark\"]},\"capacitor_configuration\":{\"label\":\"近远端电容配置\",\"description\":\"近端、远端电容及关联电感配置。\",\"aliases\":[\"电容配置\",\"近远端电容配置\",\"电容规格配置\"],\"expand_to\":[\"inductor\",\"near_capacitor\",\"far_capacitor\"]},\"capacitor_quantity\":{\"label\":\"电容数量\",\"description\":\"近端、远端及远端不同封装类型的电容数量字段集合。\",\"aliases\":[\"电容数量统计\",\"电容数量信息\",\"电容个数统计\"],\"expand_to\":[\"near_cap_count\",\"far_cap_count\",\"far_0402_regular\",\"far_0402_three_terminal\",\"far_0201_regular\"]},\"capacitor_area\":{\"label\":\"电容面积\",\"description