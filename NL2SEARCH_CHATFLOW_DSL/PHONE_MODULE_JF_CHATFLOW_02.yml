            "source_code": "def main(body='', status_code=0, jf_sql_plan_json=''):\n    import json\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    def load_json(raw, default):\n        try:\n            obj = json.loads(raw or '')\n            return obj if isinstance(obj, type(default)) else default\n        except Exception:\n            return default\n\n    def fail(message, plan):\n        result = {'status':'error','source':'mysql_http','rows':[],'row_count':0,'sql_plan':plan,'error':message}\n        return {\n            'mysql_query_result_json': dump(result),\n            'mysql_query_status': 'error',\n            'mysql_query_error_answer': 'MySQL 查询失败，原因：%s' % message,\n        }\n\n    plan = load_json(jf_sql_plan_json, {})\n    try:\n        http_status = int(status_code or 0)\n    except Exception:\n        http_status = 0\n\n    if http_status < 200 or http_status >= 300:\n        return fail('后端接口 HTTP 状态异常: %s' % http_status, plan)\n\n    try:\n        payload = json.loads(body or '{}')\n    except Exception as exc:\n        return fail('后端接口响应不是合法 JSON: %s' % exc, plan)\n\n    if not isinstance(payload, dict):\n        return fail('后端接口响应顶层不是 JSON 对象。', plan)\n\n    response_code = payload.get('code')\n    if response_code not in (None, 0, 200, '0', '200'):\n        message = payload.get('msg') or payload.get('message') or '后端接口返回失败状态'\n        return fail('%s，code=%s' % (message, response_code), plan)\n\n    data = payload.get('data')\n    if not isinstance(data, dict):\n        return fail('后端接口响应缺少 data 对象。', plan)\n\n    rows = data.get('rows')\n    if rows is None:\n        rows = []\n    if not isinstance(rows, list):\n        return fail('后端接口 data.rows 不是数组。', plan)\n\n    row_count = data.get('rowCount')\n    if row_count is None:\n        row_count = data.get('row_count')\n    try:\n        row_count = int(row_count)\n    except Exception:\n        row_count = len(rows)\n\n    result = {'status':'ok','source':'mysql_http','rows':rows,'row_count':row_count,'sql_plan':plan,'error':''}\n    return {\n        'mysql_query_result_json': dump(result),\n        'mysql_query_status': 'ok',\n        'mysql_query_error_answer': '',\n    }\n",
