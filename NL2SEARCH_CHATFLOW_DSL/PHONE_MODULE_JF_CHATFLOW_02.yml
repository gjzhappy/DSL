            "code_language": "python3",
            "code": "def main(llm_handler_result_json='', mysql_query_result_json=''):\n    import html\n    import json\n\n    def load_json(raw):\n        try:\n            obj = json.loads(raw or '{}')\n            return obj if isinstance(obj, dict) else {}\n        except Exception:\n            return {}\n\n    def display_value(value):\n        if value is None:\n            return 'NULL'\n        if isinstance(value, (dict, list)):\n            text = json.dumps(value, ensure_ascii=False, separators=(',', ':'))\n        else:\n            text = str(value)\n        # Escape renderer control characters without changing the displayed value.\n        return html.escape(text, quote=False).replace('\\r\\n', '\\n').replace('\\r', '\\n').replace('\\n', '<br>')\n\n    obj = load_json(llm_handler_result_json)\n    if obj:\n        if obj.get('handler_status') == 'error':\n            return {'final_answer': obj.get('error') or 'PHONE 输出处理失败'}\n        answer = obj.get('answer') or json.dumps(obj, ensure_ascii=False)\n        query_result = load_json(mysql_query_result_json)\n        if query_result.get('status') == 'ok':\n            rows = query_result.get('rows') if isinstance(query_result.get('rows'), list) else []\n            plan = query_result.get('sql_plan') if isinstance(query_result.get('sql_plan'), dict) else {}\n            field_meta = plan.get('selected_field_meta') if isinstance(plan.get('selected_field_meta'), dict) else {}\n            lines = ['## 原始查询数据', '', '<details>', '<summary>查看原始查询数据</summary>', '']\n            if not rows:\n                lines.append('本次查询未返回业务数据。')\n            else:\n                for index, row in enumerate(rows, 1):\n                    if len(rows) > 1:\n                        lines.extend(['**第 %d 条**' % index, ''])\n                    if isinstance(row, dict):\n                        for field, value in row.items():\n                            meta = field_meta.get(field) if isinstance(field_meta.get(field), dict) else {}\n                            # Prefer the business label, but retain every returned field.\n                            label = str(meta.get('label') or field)\n                            lines.append('- **%s：** %s' % (html.escape(label, quote=False), display_value(value)))\n                    else:\n                        lines.append('- **值：** %s' % display_value(row))\n                    lines.append('')\n            lines.append('</details>')\n            answer = str(answer).rstrip() + '\\n\\n' + '\\n'.join(lines)\n        return {'final_answer': answer}\n\n    return {'final_answer': 'PHONE 查询完成，但未生成有效回答。'}\n"
