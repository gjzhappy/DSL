            "source_code": "def main(body='', status_code=200):\n    import json\n\n    def truncate(text, limit=1200):\n        text = '' if text is None else str(text)\n        return text if len(text) <= limit else text[:limit] + '...'\n\n    def load_payload(raw):\n        if isinstance(raw, dict):\n            return raw, ''\n        if raw is None:\n            return None, 'JAVA_FULL_LLM_BODY_EMPTY'\n        if isinstance(raw, str):\n            if not raw.strip():\n                return None, 'JAVA_FULL_LLM_BODY_EMPTY'\n            try:\n                return json.loads(raw), ''\n            except Exception as exc:\n                return None, 'JAVA_FULL_LLM_BODY_JSON_INVALID: %s' % truncate(exc)\n        return None, 'JAVA_FULL_LLM_BODY_TYPE_INVALID'\n\n    def error_summary(payload, fallback):\n        parts = []\n        if fallback:\n            parts.append(str(fallback))\n        if isinstance(payload, dict):\n            for key in ('msg', 'errorCode', 'retryable', 'requestId'):\n                if key in payload and payload.get(key) not in (None, ''):\n                    parts.append('%s=%s' % (key, payload.get(key)))\n        return truncate('; '.join(parts))\n\n    def parse_http_code(value):\n        try:\n            return int(value)\n        except Exception:\n            return 0\n\n    status = 'error'\n    answer = ''\n    error = ''\n\n    payload, load_error = load_payload(body)\n    http_code = parse_http_code(status_code)\n\n    try:\n        if load_error:\n            error = error_summary(payload, load_error)\n        elif not isinstance(payload, dict):\n            error = error_summary(payload, 'JAVA_FULL_LLM_JSON_NOT_OBJECT')\n        elif http_code < 200 or http_code >= 300:\n            error = error_summary(\n                payload,\n                'JAVA_FULL_LLM_HTTP_ERROR status=%s' % http_code\n            )\n        elif payload.get('code') != 200:\n            error = error_summary(payload, 'JAVA_FULL_LLM_CODE_NOT_200')\n        else:\n            data = payload.get('data')\n            if not isinstance(data, dict):\n                error = error_summary(payload, 'JAVA_FULL_LLM_DATA_MISSING')\n            else:\n                choices = data.get('choices')\n                if not isinstance(choices, list) or not choices:\n                    error = error_summary(payload, 'JAVA_FULL_LLM_CHOICES_EMPTY')\n                else:\n                    first = choices[0] if isinstance(choices[0], dict) else {}\n                    message = (\n                        first.get('message')\n                        if isinstance(first.get('message'), dict)\n                        else {}\n                    )\n                    content = message.get('content')\n                    if not isinstance(content, str) or not content.strip():\n                        error = error_summary(\n                            payload,\n                            'JAVA_FULL_LLM_CONTENT_EMPTY'\n                        )\n                    else:\n                        answer = content.strip()\n                        status = 'ok'\n    except Exception as exc:\n        error = error_summary(payload, 'JAVA_FULL_LLM_PARSE_FAILED: %s' % exc)\n        answer = ''\n        status = 'error'\n\n    if status != 'ok':\n        answer = ''\n        status = 'error'\n        if not error:\n            error = 'JAVA_FULL_LLM_ERROR'\n\n    result = {\n        'llm_status': status,\n        'llm_text': answer,\n        'llm_source': 'full_llm',\n        'error': error\n    }\n    return {\n        'full_llm_result_json': json.dumps(result, ensure_ascii=False),\n        'full_llm_status': status\n    }\n",
