            "source_code": "def main(context_json=''):\n    import json\n    try:\n        context=json.loads(context_json or '{}')\n        if not isinstance(context,dict):context={}\n    except Exception:context={}\n    sql=(\"SELECT DISTINCT manufacturer, platform, device_type, device_model FROM sn_cis_integration_competition_wide WHERE manufacturer IS NOT NULL AND platform IS NOT NULL AND device_type IS NOT NULL AND device_model IS NOT NULL ORDER BY manufacturer, platform, device_type, device_model\")\n    return {'integration_competition_identity_catalog_request_body_json':json.dumps({'sql':sql,'params':[],'user':str(context.get('user') or '').strip()},ensure_ascii=False,separators=(',',':')),'integration_competition_identity_catalog_request_status':'ok','integration_competition_identity_catalog_request_error':''}\n",
