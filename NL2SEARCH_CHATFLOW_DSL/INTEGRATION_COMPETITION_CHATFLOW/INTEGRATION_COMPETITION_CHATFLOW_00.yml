      {
        "description": "Registry字段片段00，来自正式MySQL DDL；由Registry加载节点合并。",
        "id": "env-integration-competition-registry-fields-00",
        "name": "INTEGRATION_COMPETITION_QUERY_REGISTRY_FIELDS_00_JSON",
        "selector": [
