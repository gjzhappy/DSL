            "source_code": "def main(context_json='', integration_competition_registry_json='', integration_competition_alias_index_json='', integration_competition_registry_parse_status='', integration_competition_registry_error='', integration_competition_query_memory_json=''):\n    import json\n    import re\n    import unicodedata\n\n    def load_json(raw, default):\n        try:\n            obj = json.loads(raw or '')\n            return obj if isinstance(obj, type(default)) else default\n        except Exception:\n            return default\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    def normalize(value):\n        text = unicodedata.normalize('NFKC', str(value or '')).strip().casefold()\n        return re.sub(r'[\\s_\\-]+', '', text)\n\n    def valid_identifier(value):\n        return bool(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', str(value or '')))\n\n    def as_int(value, default):\n        try:\n            n = int(value)\n            return n if n > 0 else default\n        except Exception:\n            return default\n\n    def stable_unique(values):\n        result = []\n        for value in values:\n            if value not in result:\n                result.append(value)\n        return result\n\n    REFERENCE_WORDS = (\n        '它', '它们', '他们', '其', '其余', '这些', '那些',\n        '上述', '前面', '之前', '刚才',\n    )\n    REFERENCE_PHRASES = (\n        '这些设备', '这些机型', '这些型号', '这些厂商', '这些设备类型', '这些集成度数据',\n        '上述设备', '上述机型', '上述型号', '上述厂商', '刚才的设备', '之前的机型',\n        '这些平台',\n        '这些设备',\n        '这些设备',\n        '这些设备',\n        '这些设备',\n        '上述平台',\n        '上述设备',\n        '上述设备',\n        '上述设备',\n        '刚才的设备',\n        '之前的设备',\n        '这些模块配置',\n    )\n\n    def has_reference_expression(question_norm):\n        # 短语优先；轻量指代只影响 scope 决策，不参与字段/别名解析。\n        if any(normalize(phrase) in question_norm for phrase in REFERENCE_PHRASES):\n            return True\n        return any(normalize(word) in question_norm for word in REFERENCE_WORDS)\n\n    def normalize_semantic_filters(items, allowed_fields, allowed_composites):\n        if not isinstance(items, list):\n            raise ValueError('memory semantic filters invalid')\n        result = []\n        for item in items:\n            if not isinstance(item, dict):\n                raise ValueError('memory semantic filter invalid')\n            target_type, target, operator = item.get('target_type'), item.get('target'), item.get('operator')\n            if operator not in ('exists', 'empty'):\n                raise ValueError('memory semantic operator invalid')\n            if (target_type == 'field' and target not in allowed_fields) or (target_type == 'composite' and target not in allowed_composites):\n                raise ValueError('memory semantic target invalid')\n            if target_type not in ('field', 'composite'):\n                raise ValueError('memory semantic target type invalid')\n            normalized = {'target_type': target_type, 'target': target, 'operator': operator}\n            if normalized not in result:\n                result.append(normalized)\n        return result\n\n    def normalize_scope(scope, allowed_fields, filter_fields, canonical_values, allowed_composites):\n        if not isinstance(scope, dict) or not isinstance(scope.get('where_filters'), dict) or not isinstance(scope.get('select_fields'), list) or not isinstance(scope.get('selected_composites'), list):\n            raise ValueError('scope contract invalid')\n        where = {}\n        for field, values in scope['where_filters'].items():\n            if field not in filter_fields or not isinstance(values, list) or not values:\n                raise ValueError('memory filter invalid')\n            if any(not isinstance(value, str) or value not in canonical_values.get(field, ()) for value in values):\n                raise ValueError('memory canonical value invalid')\n            where[field] = stable_unique(values)\n        selected = stable_unique(scope['select_fields'])\n        if any(not isinstance(field, str) or field not in allowed_fields for field in selected):\n            raise ValueError('memory select field invalid')\n        composites = stable_unique(scope['selected_composites'])\n        if any(not isinstance(name, str) or name not in allowed_composites for name in composites):\n            raise ValueError('memory composite invalid')\n        semantics = normalize_semantic_filters(scope.get('semantic_filters', []), allowed_fields, allowed_composites)\n        return {'source_user_query': str(scope.get('source_user_query') or ''), 'where_filters': where, 'semantic_filters': semantics, 'select_fields': selected, 'selected_composites': composites}\n\n    def safe_parse_query_memory(raw, allowed_fields, filter_fields, canonical_values, allowed_composites):\n        if not raw or str(raw).strip() in ('', 'null', '{}'):\n            return [], '', False\n        try:\n            memory = json.loads(raw)\n            if not isinstance(memory, dict) or memory.get('version') != 'integration_competition_query_memory_v1':\n                raise ValueError('memory envelope invalid')\n            raw_scope = memory.get('last_scope')\n            # 只为读取已部署的 v1 记忆保留旧 query_scopes 兼容入口。\n            if raw_scope is None and isinstance(memory.get('query_scopes'), list) and memory['query_scopes']:\n                raw_scope = memory['query_scopes'][-1]\n            if raw_scope is None:\n                return [], str(memory.get('current_user_query') or ''), False\n            scope = normalize_scope(raw_scope, allowed_fields, filter_fields, canonical_values, allowed_composites)\n            return [scope], str(memory.get('current_user_query') or ''), False\n        except Exception:\n            return [], '', True\n\n    def resolve_query_scope(history, question, behavior, where_filters, semantic_filters, select_fields, selected_composites):\n        base = history[-1] if history and behavior in ('inherit', 'extend') else {}\n        effective_where = dict(base.get('where_filters') or {})\n        effective_semantics = list(base.get('semantic_filters') or [])\n        if behavior == 'reset':\n            effective_where = dict(where_filters)\n            effective_semantics = list(semantic_filters)\n        elif behavior == 'extend':\n            effective_where.update(where_filters)\n            for item in semantic_filters:\n                if item not in effective_semantics:\n                    effective_semantics.append(item)\n        effective = {\n            'source_user_query': question,\n            'where_filters': effective_where,\n            'semantic_filters': effective_semantics,\n            'select_fields': list(select_fields),\n            'selected_composites': list(selected_composites),\n        }\n        return effective\n\n    def compile_scoped_where(scopes, filter_fields):\n        clauses, params, seen = [], [], []\n        for scope in scopes:\n            signature = tuple((field, tuple(scope['where_filters'].get(field) or [])) for field in filter_fields if scope['where_filters'].get(field))\n            if not signature or signature in seen:\n                continue\n            seen.append(signature)\n            parts = []\n            for field, values in signature:\n                parts.append('`%s` IN (%s)' % (field, ','.join(['?'] * len(values))))\n                params.extend(values)\n            clauses.append('(' + ' AND '.join(parts) + ')')\n        return clauses, params\n\n    def parse_presence_filters(question_norm, alias_hits, allowed_fields, allowed_composites):\n        # 通用存在性语义属于 Query Parser；Registry 仍仅提供字段和 composite 别名。\n        empty_words = ('不存在', '未提供', '没有', '缺少', '为空', '空值', '无')\n        exists_words = ('不为空', '存在', '具备', '拥有', '带有', '包含', '非空', '有值', '有')\n        filters = []\n        consumed_operator_positions = set()\n        for hit in alias_hits:\n            target = hit.get('target') if isinstance(hit, dict) else None\n            if not isinstance(target, dict) or target.get('kind') not in ('field', 'composite'):\n                continue\n            target_type = target.get('kind')\n            name = target.get('name')\n            if (target_type == 'field' and name not in allowed_fields) or (target_type == 'composite' and name not in allowed_composites):\n                continue\n            left = question_norm[max(0, hit['start'] - 4):hit['start']]\n            right = question_norm[hit['end']:hit['end'] + 