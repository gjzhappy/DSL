        ],
        "value": "[[\"manufacturer\",\"厂商\",\"设备厂商名称；设备身份唯一键组成部分。\",[\"厂商名称\",\"制造商\",\"品牌\"]],[\"platform\",\"平台\",\"芯片平台/平台代号；设备身份唯一键组成部分。\",[\"平台名称\",\"芯片平台\",\"平台代号\"]],[\"device_type\",\"设备类型\",\"设备类型，例如phone；设备身份唯一键组成部分。\",[\"设备类别\",\"产品类型\"]],[\"device_model\",\"设备型号\",\"设备型号；设备身份唯一键组成部分。\",[\"机型\",\"型号\",\"产品型号\"]],[\"release_date\",\"设备发布时间\",\"设备发布时间；统一存储为UTC时间。\",[\"发布时间\",\"发布日期\"]],[\"release_date_text\",\"原始发布时间文本\",\"无法规范化为日期时间时保留的原始发布时间文本。\",[\"发布时间原文\",\"发布日期原文\"]],[\"device_pic_url\",\"设备图片URL\",\"设备图片地址；用于设备识别和前端展示，不参与集成面积计算。\",[\"设备图片\",\"图片地址\"]],[\"source_document_id\",\"来源文档ID\",\"来源MongoDB integration_device文档的ObjectId十六进制值；仅用于数据追溯，不参与业务分类、汇总或面积计算。\",[\"MongoDB来源ID\",\"原始文档ID\"]],[\"area_unit\",\"面积单位\",\"本表所有集成面积及面积汇总字段的统一单位。\",[\"面积度量单位\"]],[\"semantic_version\",\"业务语义版本\",\"本行采用的CIS统一业务语义树版本；字段路径、业务定义或汇总口径变更时升级。当前DDL版本为cis-integration-v4。\",[\"语义版本\"]],[\"integration_total_area_mm2\",\"整机总集成面积\",\"业务定义：按已确认口径：小系统总计 + 外设总计 + 无线总计。若由三大域派生，空值按0参与计算；数据层级：L0整机总计；统计规则：唯一整机顶层指标\",[]],[\"small_system_total_area_mm2\",\"小系统合计面积\",\"业务定义：来源提供的小系统总面积；数据层级：L1顶层业务域汇总；统计规则：作为integration_total三大组成域之一\",[]],[\"peripheral_total_area_mm2\",\"外设合计面积\",\"业务定义：来源提供的外设总面积。不得通过将peripheral_composite、camera、audio、display、NFC、sensor、interface、charger等分析字段直接求和来替代。；数据层级：L1顶层业务域汇总；统计规则：作为integration_total三大组成域之一\",[]],[\"wireless_total_area_mm2\",\"无线合计面积\",\"业务定义：来源提供的无线总面积，业务域包含RF与NC；数据层级：L1顶层业务域汇总；统计规则：作为integration_total三大组成域之一\",[]],[\"wireless_rf_total_area_mm2\",\"无线 → RF合计面积\",\"业务定义：来源提供的RF子域总面积；数据层级：L2无线子域汇总；统计规则：来源汇总值\",[]],[\"wireless_nc_total_area_mm2\",\"无线 → NC合计面积\",\"业务定义：来源提供的NC非蜂窝无线子域总面积；数据层级：L2无线子域汇总；统计规则：来源汇总值\",[]],[\"camera_total_area_mm2\",\"摄像头 → CAM合计面积\",\"业务定义：摄像头模块汇总值；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"fpc_total_area_mm2\",\"连接与接口 → FPC合计面积\",\"业务定义：FPC模块汇总值，覆盖FPC接口及NTC相关主FPC接口支路。；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"io_expansion_total_area_mm2\",\"连接与接口 → IO扩展合计面积\",\"业务定义：IO扩展模块汇总值，对应IODIE及相关输入输出扩展功能。；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"wireless_nc_nfc_total_area_mm2\",\"无线 → NC → NFC合计面积\",\"业务定义：NFC模块汇总值，涉及NFC、NFC_110T及NFC_FE相关电路；数据层级：NC下级模块汇总视图；统计规则：属于NC下级视图\",[]],[\"pmu_total_area_mm2\",\"电源管理 → PMU合计面积\",\"业务定义：PMU模块汇总值，覆盖PMU0/PMU1/PMU2的BUCK、LDO、数字时钟等子模块；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"scharger_total_area_mm2\",\"电源管理 → Scharger合计面积\",\"业务定义：来源提供的Scharger模块汇总值，对应CHARGER_RES、CHARGER2、副Charger、Buck_Charger、SC1/SC2、Scharger_V510及WL_Charger等条目。外设Scharge/Wcharge为独立字段；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"sensor_lowercase_group_total_area_mm2\",\"传感器 → sensor（小写模块标识）合计面积\",\"业务定义：原始模块标识为小写sensor的传感器汇总值；数据层级：模块级汇总视图；统计规则：不得与sensor_uppercase_group_total或其明细自动合并/相加。\",[]],[\"sensor_uppercase_group_total_area_mm2\",\"传感器 → SENSOR（大写模块标识）合计面积\",\"业务定义：大写SENSOR模块汇总值，涉及环境光/接近及SAR子模块；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"sim_total_area_mm2\",\"连接与接口 → SIM合计面积\",\"业务定义：SIM模块汇总值，涉及SIM_main、SIM_SD及SIM_SD_IOEXP；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"test_point_total_area_mm2\",\"测试与调试 → 测试点合计面积\",\"业务定义：测试点模块汇总值，涉及SIM_LGA_Point、Test_point、Test_Point及屏蔽结构；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"storage_total_area_mm2\",\"存储合计面积\",\"业务定义：独立存储模块汇总值，对应存储分支下的memory；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"battery_total_area_mm2\",\"电源管理 → 电池合计面积\",\"业务定义：电池模块汇总值，涉及Battery、Battery_Main、电池保护及BJEH（贝加尔湖）；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"analog_phy_total_area_mm2\",\"连接与接口 → 模拟PHY合计面积\",\"业务定义：模拟PHY模块汇总值，涉及USB接口及保护电路；数据层级：模块级汇总视图；统计规则：保留来源汇总值\",[]],[\"wireless_rf_frontend_total_area_mm2\",\"无线 → RF → 射频前端合计面积\",\"业务定义：射频前端模块汇总值，覆盖PA、PAMID、RF Switch、LNA、TRX及相关供电/跟踪电路；数据层级：RF下级模块汇总视图；统计规则：不得与wireless_rf_total、卫星方案汇总、天线汇总或射频前端明细重复相加。\",[]],[\"wireless_antenna_total_area_mm2\",\"无线 → 天线（跨NC/RF物理硬件视图）合计面积\",\"业务定义：来源提供的天线硬件汇总值；数据层级：跨域硬件汇总视图；统计规则：不是无线下第三个可加总业务域\",[]],[\"temperature_detection_total_area_mm2\",\"传感器 → 温度检测（原始分组，业务归属待确认）合计面积\",\"业务定义：来源中名为温度检测的分组汇总值，但明细为Key/KEY，现有定义不足以确认它们属于温度传感器。；数据层级：原始分组汇总视图；统计规则：保留来源值\",[]],[\"display_total_area_mm2\",\"显示合计面积\",\"业务定义：显示模块汇总值，涉及Display_INTERFACE、Display_PWR、LCD、MLCD/MSLCD及供电/旁路；数据层级：模块级汇总视图；统计