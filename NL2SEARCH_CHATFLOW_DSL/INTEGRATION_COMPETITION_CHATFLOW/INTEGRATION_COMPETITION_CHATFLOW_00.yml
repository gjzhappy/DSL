            "source_code": "def main(registry_raw_json='', body='', status_code=0, request_status='ok'):\n    import json,re,unicodedata\n    def fail(message,raw='{}'):\n        return {'integration_competition_registry_enriched_json':raw or '{}','integration_competition_registry_load_status':'error','integration_competition_registry_load_error':message,'integration_competition_identity_catalog_row_count':'0','integration_competition_identity_catalog_warning_count':'0'}\n    if str(request_status or '')!='ok':return fail('IDENTITY_CATALOG_REQUEST_NOT_READY',registry_raw_json)\n    try:\n        registry=json.loads(registry_raw_json or '{}')\n        payload=body if isinstance(body,dict) else json.loads(body or '{}')\n        http_status=int(status_code or 0)\n    except Exception:return fail('IDENTITY_CATALOG_RESPONSE_INVALID',registry_raw_json)\n    if not isinstance(registry,dict) or registry.get('table')!='sn_cis_integration_competition_wide':return fail('REGISTRY_TABLE_INVALID',registry_raw_json)\n    if http_status<200 or http_status>=300 or not isinstance(payload,dict):return fail('IDENTITY_CATALOG_HTTP_INVALID',registry_raw_json)\n    if payload.get('code') not in (None,0,200,'0','200'):return fail('IDENTITY_CATALOG_BACKEND_ERROR',registry_raw_json)\n    data=payload.get('data')\n    if not isinstance(data,dict):return fail('IDENTITY_CATALOG_DATA_INVALID',registry_raw_json)\n    rows=data.get('rows')\n    if rows is None:rows=[]\n    if not isinstance(rows,list):return fail('IDENTITY_CATALOG_ROWS_INVALID',registry_raw_json)\n    identity_fields=('manufacturer','platform','device_type','device_model')\n    fields=registry.get('fields') if isinstance(registry.get('fields'),dict) else {}\n    if any(field not in fields for field in identity_fields):return fail('IDENTITY_CATALOG_FIELDS_INVALID',registry_raw_json)\n    def normalize(value):return re.sub(r'[\\s_-]+','',unicodedata.normalize('NFKC',str(value or '')).strip().casefold())\n    approved_aliases={'manufacturer':{'Apple':['苹果'],'Xiaomi':['小米']},'platform':{'A16':['Apple A16','苹果A16'],'A17':['Apple A17','苹果A17'],'A18':['Apple A18','苹果A18'],'A19':['Apple A19','苹果A19']},'device_type':{},'device_model':{}}\n    canonical={field:[] for field in identity_fields}\n    for row in rows:\n        if not isinstance(row,dict):return fail('IDENTITY_CATALOG_ROW_INVALID',registry_raw_json)\n        for field in identity_fields:\n            value=row.get(field)\n            if value is None:continue\n            if isinstance(value,(dict,list,bool)):return fail('IDENTITY_CATALOG_VALUE_TYPE_INVALID',registry_raw_json)\n            value=str(value)\n            if value.strip() and value not in canonical[field]:canonical[field].append(value)\n    value_aliases={};warning_count=0\n    for field in identity_fields:\n        proposed={value:[value]+approved_aliases.get(field,{}).get(value,[]) for value in canonical[field]}\n        alias_owners={}\n        for value,aliases in proposed.items():\n            for alias in aliases:alias_owners.setdefault(normalize(alias),set()).add(value)\n        definitions={}\n        for value,aliases in proposed.items():\n            safe=[alias for alias in aliases if len(alias_owners.get(normalize(alias),set()))==1]\n            if not safe or normalize(value) in {key for key,owners in alias_owners.items() if len(owners)>1}:\n                warning_count+=1\n                continue\n            definitions[value]={'aliases':safe}\n        value_aliases[field]=definitions\n    registry['value_aliases']=value_aliases\n    registry['runtime_identity_catalog']={'source':'mysql_distinct','row_count':len(rows),'normalization_collision_count':warning_count}\n    return {'integration_competition_registry_enriched_json':json.dumps(registry,ensure_ascii=False,separators=(',',':')),'integration_competition_registry_load_status':'ok','integration_competition_registry_load_error':'','integration_competition_identity_catalog_row_count':str(len(rows)),'integration_competition_identity_catalog_warning_count':str(warning_count)}\n",
