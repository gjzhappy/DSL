      {
        "description": "整机集成度竞分Registry基础结构；真实字段定义由三个DDL字段片段在加载节点合并。",
        "id": "env-jf-capacitor-query-registry-json",
        "name": "INTEGRATION_COMPETITION_QUERY_REGISTRY_JSON",
        "selector": [
          "env",
          "INTEGRATION_COMPETITION_QUERY_REGISTRY_JSON"
        ],
        "value": "{\"version\":\"1.0\",\"table\":\"sn_cis_integration_competition_wide\",\"query_roles\":{\"sql_filter_fields\":[\"manufacturer\",\"platform\",\"device_type\",\"device_model\"],\"sql_select_fields\":\"all_fields\"},\"fields\":{},\"composite_fields\":{\"identity\":{\"label\":\"设备基础信息\",\"description\":\"设备唯一业务身份由manufacturer、platform、device_type、device_model组成；发布时间和图片地址为补充信息。\",\"aliases\":[\"设备基础信息\",\"设备身份\",\"机型信息\"],\"_expand_exact\":[\"manufacturer\",\"platform\",\"device_type\",\"device_model\",\"release_date\",\"release_date_text\",\"device_pic_url\"]},\"integration_overview\":{\"label\":\"整机集成度概览\",\"description\":\"整机唯一顶层总计。来源直接提供时优先使用；派生仅允许小系统、外设、无线三个顶层单值参与，任一域为逗号分隔多值时不得派生。\",\"aliases\":[\"整机集成度\",\"整机集成度概览\",\"整机总览\"],\"_expand_exact\":[\"integration_total_area_mm2\",\"small_system_total_area_mm2\",\"peripheral_total_area_mm2\",\"wireless_total_area_mm2\"]},\"top_level_domains\":{\"label\":\"一级业务域总计\",\"description\":\"整机总计的三个顶层业务域：小系统、外设、无线；其他模块汇总和明细不得重复加入。\",\"aliases\":[\"一级业务域\",\"三大业务域\",\"一级域面积\"],\"_expand_exact\":[\"small_system_total_area_mm2\",\"peripheral_total_area_mm2\",\"wireless_total_area_mm2\"]},\"small_system\":{\"label\":\"小系统\",\"description\":\"小系统来源总面积及SOC、UFS、Modem、PMK、PMU等业务路径；SOC/UFS父级总计不得与下级明细重复求和。\",\"aliases\":[\"小系统\",\"小系统模块\",\"小系统组成\"],\"_expand_prefixes\":[\"small_system_\"]},\"peripheral\":{\"label\":\"外设\",\"description\":\"外设来源总面积及外设综合统计项；复合统计项可能覆盖多个外设功能视图，不得重复相加。\",\"aliases\":[\"外设\",\"外设模块\"],\"_expand_prefixes\":[\"peripheral_\"]},\"wireless\":{\"label\":\"无线\",\"description\":\"无线总计是来源提供的顶层值；RF与NC是子域来源值，不强制相加等于无线总计；天线是跨NC/RF的物理硬件视图，不是第三个可加总业务域。\",\"aliases\":[\"无线\",\"无线模块\",\"无线部分\"],\"_expand_prefixes\":[\"wireless_\"]},\"wireless_rf\":{\"label\":\"无线RF\",\"description\":\"RF子域来源汇总及射频前端、卫星射频链路和明细；不得与RF总计重复相加。\",\"aliases\":[\"无线RF\",\"RF域\",\"射频\"],\"_expand_prefixes\":[\"wireless_rf_\"]},\"wireless_nc\":{\"label\":\"无线NC\",\"description\":\"NC子域来源汇总及Wi-Fi/BT、UWB、Connectivity、NFC等视图；不得与NC总计重复相加。\",\"aliases\":[\"无线NC\",\"NC域\",\"非蜂窝无线\"],\"_expand_prefixes\":[\"wireless_nc_\"]},\"wireless_antenna\":{\"label\":\"天线\",\"description\":\"天线是跨NC/RF的物理硬件视图，不得作为无线总计的第三个加数，也不得与天线明细重复相加。\",\"aliases\":[\"天线\",\"天线模块\"],\"_expand_prefixes\":[\"wireless_antenna_\"]},\"wireless_candidates\":{\"label\":\"无线候选归类视图\",\"description\":\"DDL标记为NC候选或RF候选的来源路径；分类未确认前不得自动并入已确认RF或NC。\",\"aliases\":[\"无线候选项\",\"待确认无线模块\"],\"_expand_prefixes\":[\"wireless_nc_rf_path_\"],\"_expand_contains\":[\"candidate\"]},\"satellite\":{\"label\":\"卫星导航与通信相关视图\",\"description\":\"卫星导航、卫星通信、北斗、天通、星网等路径。RF/NC、方案汇总、候选字段和天线视图可能交叉，不能直接相加。\",\"aliases\":[\"卫星通信\",\"卫星导航\",\"北斗\",\"天通\",\"星网\"],\"_expand_contains\":[\"satellite\",\"gnss\",\"beidou\",\"tiantong\",\"xingwang\"]},\"satellite_schemes\":{\"label\":\"卫星方案代号视图\",\"description\":\"XRZ=仙人掌、FXZ=风信子、PGY=蒲公英；GG仅保留原始代号，中文名称及具体映射未确认，不得将GG与FXZ或星网1.0自动归并。\",\"aliases\":[\"卫星方案代号\",\"XRZ方案\",\"FXZ方案\",\"PGY方案\",\"GG代号\"],\"_expand_contains\":[\"xrz\",\"fxz\",\"pgy\",\"gg\"]},\"rf_frontend\":{\"label\":\"射频前端\",\"description\":\"射频前端汇总与明细不得再与RF总计、卫星方案或天线视图重复相加。\",\"aliases\":[\"射频前端\",\"RF前端\"],\"_expand_prefixes\":[\"wireless_rf_frontend_\"]},\"camera\":{\"label\":\"摄像头CAM\",\"description\":\"CAM模块汇总与明细可能存在别名或父子覆盖，未确认互斥前不从明细重新求和。\",\"aliases\":[\"摄像头\",\"CAM\"],\"_expand_prefixes\":[\"camera_\"]},\"interface\":{\"label\":\"连接与接口\",\"description\":\"连接与接口相关字段，包括FPC、IO扩展、SIM和模拟PHY等来源路径；父子项和跨域视图不得重复相加。\",\"aliases\":[\"连接与接口\",\"接口模块\"],\"_expand_prefixes\":[\"interface_\",\"fpc_\",\"io_expansion_\",\"sim_\",\"analog_phy_\"]},\"power_management\":{\"label\":\"电源管理\",\"description\":\"电源管理路径下的PMU、Scharger、Charger、5V boost、无线充电和电池等字段。小系统路径下的PMU1/PMU2仍属于小系统。\",\"aliases\":[\"电源管理\",\"电源模块\",\"充电管理\"],\"_expand_prefixes\":[\"power_\"],\"_expand_exact\":[\"pmu_total_area_mm2\",\"scharger_total_area_mm2\",\"battery_total_area_mm2\"]},\"battery\":{\"label\":\"电池\",\"description\":\"电池总计及电池相关明细；与其他电源管理汇总视图不得重复相加。\",\"aliases\":[\"电池模块\",\"电池\"],\"_expand_prefixes\":[\"power_battery_\"],\"_expand_exact\":[\"battery_total_area_mm2\"]},\"sensors\":{\"label\":\"传感器\",\"description\":\"小写sensor与大写SENSOR是独立来源分组；温度检测当前标记为原始分组且业务归属待确认，不得擅自并入温度传感器统计。\",\"aliases\":[\"传感器\",\"传感器模块\"],\"_expand_prefixes\":[\"sensor_\",\"temperature_detection_\"]},\"sensor_lowercase_group\":{\"label\":\"小写sensor分组\",\"description\":\"小写sensor分组与大写SENSOR分组保持独立，不合并或相加。\",\"aliases\":[\"小写sensor分组\",\"sensor小写分组\"],\"_expand_prefixes\":[\"sensor_lowercase_group_\"]},\"sensor_uppercase_group\":{\"label\":\"大写SENSOR分组\",\"description\":\"大写SENSOR分组与小写sensor分组保持独立，不合并或相加。\",\"aliases\":[\"大写SENSOR分组\",\"SENSOR分组\"],\"_expand_prefixes\":[\"sensor_uppercase_group_\"]},\"temperature_detection_raw_group\":{\"label\":\"温度检测原始分组\",\"description\":\"温度检测当前标记为原始分组且业务归属待确认；Key/KEY归属确认前不得用于温度传感器专项分析。\",\"aliases\":[\"温度检测原始分组\",\"温度检测Key\"],\"_expand_prefixes\":[\"temperature_detection_\"],\"_expand_contains\":[\"temperature_key\"]},\"storage\":{\"label\":\"存储\",\"description\":\"独立存储分支与小系统UFS是不同业务路径，不得自动合并或相加。\",\"aliases\":[\"存储模块\",\"存储\"],\"_expand_prefixes\":[\"storage_\"]},\"test_and_debug\":{\"label\":\"测试与调试\",\"description\":\"测试点父级汇总与明细不得未经确认互斥后自动相加。\",\"aliases\":[\"测试点\",\"测试与调试\",\"调试点\"],\"_expand_prefixes\":[\"test_point_\"]},\"display\":{\"label\":\"显示\",\"description\":\"显示父级汇总与LCD、供电、旁路明细不得重复相加。\",\"aliases\":[\"显示模块\",\"显示\",\"屏幕\"],\"_expand_prefixes\":[\"display_\"]},\"audio\":{\"label\":\"音频\",\"description\":\"音频父级汇总与SmartPA、耳机/麦克风/振动及旁路明细不得重复相加。\",\"aliases\":[\"音频模块\",\"音频\"],\"_expand_prefixes\":[\"audio_\"]},\"design_and_raw_metadata\":{\"label\":\"设计属性与原始数据\",\"description\":\"设备设计属性、原始值注释、非面积附加指标、模块芯片型号和未映射集成度数据；均不是面积字段。\",\"aliases\":[\"设计属性\",\"PCB设计属性\",\"原始值注释\",\"附加指标\",\"模块芯片型号\",\"未映射数据\"],\"_expand_exact\":[\"device_design_attributes\",\"raw_value_annotations\",\"additional_metrics\",\"module_chip_models\",\"unmapped_integration_values\"]},\"source_traceability\":{\"label\":\"来源追溯信息\",\"description\":\"来源MongoDB integration_device文档标识，仅用于数据追溯，不参与业务分类、汇总或面积计算。\",\"aliases\":[\"来源追溯信息\",\"来源文档\",\"数据来源标识\"],\"_expand_exact\":[\"source_document_id\"]},\"release_information\":{\"label\":\"发布时间信息\",\"description\":\"设备发布时间、原始发布时间文本和设备图片URL；用于设备信息展示，不参与面积计算。\",\"aliases\":[\"发布时间信息\",\"发布日期信息\"],\"_expand_exact\":[\"release_date\",\"release_date_text\",\"device_pic_url\"]}},\"value_aliases\":{\"manufacturer\":{},\"platform\":{},\"device_type\":{},\"device_model\":{}},\"match_policies\":{\"device_model\":{\"fuzzy\":{\"enabled\":true,\"min_alias_length\":5,\"require_same_digits\":true,\"min_score_gap\":0.08,\"distance_rules\":[{\"max_length\":7,\"max_distance\":1},{\"max_length\":12,\"max_distance\":2},{\"max_length\":999,\"max_distance\":2}],\"protected_tokens\":[\"pro\",\"promax\",\"max\",\"ultra\",\"plus\",\"mini\",\"se\"],\"require_protected_tokens_equal\":true,\"protected_token_fuzzy\":{\"enabled\":true,\"max_distance\":1}}}}}",
        "value_type": "string"
      },
      {
        "description": "JF集成度竞分分析助手的系统角色与回答边界。",
        "id": "env-jf-capacitor-analysis-system-prompt",
        "name": "INTEGRATION_COMPETITION_ANALYSIS_SYSTEM_PROMPT",
        "selector": [
          "env",
          "INTEGRATION_COMPETITION_ANALYSIS_SYSTEM_PROMPT"
        ],
        "value": "你是竞分数据中心的整机集成度竞分查询与分析助手。只能依据本轮MySQL真实查询结果和Registry字段元数据回答，不得编造字段、数值、设备或模块关系。\nRegistry中的fields对应真实MySQL列；composite_fields是业务概念到真实列的展开关系。用户提出复合概念时，只能使用expand_to字段，不得自行补造字段。\nmanufacturer、platform、device_type、device_model的标准值来自每轮MySQL DISTINCT目录。只使用目录命中的标准值；无法识别的设备身份不得猜测、改写或用其他设备代替。\n本表一行对应一台设备。比较设备时保留厂商、平台、设备类型、设备型号的完整身份。\n面积列为TEXT。重复观测按来源顺序用英文逗号拼接，例如42.77,16.59。逗号分隔值原样保留顺序，不得拆开后SUM、平均、排序、去重或覆盖。\nintegration_total_area_mm2是整机唯一顶层总计。来源直接提供时优先使用来源值；分析阶段不得通过明细重新计算。派生仅允许小系统、外设、无线三个顶层单值参与；任一顶层域为逗号分隔多值时不得派生。\n整机总计只对应小系统、外设、无线三个顶层域。其他模块级、子域级或跨域*_total_area_mm2不得与顶层域混算。\n无线总计不强制等于RF+NC，也不强制等于RF总计+NC总计。天线是跨NC/RF的物理硬件视图，不是无线下第三个可加总业务域。\n父级汇总、子级明细、复合统计项和跨域视图可能重叠。SOC/UFS、peripheral_composite、RF/NC、NFC、射频前端、天线等不得未经明确互斥规则而相加。\nNULL表示未提供、未知或不适用，不等于0；0表示明确记录为零。五个JSON字段按各自定义解释，不得当作面积字段。\nXRZ=仙人掌、FXZ=风信子、PGY=蒲公英；GG仅保留原始代号，其中文名称及具体方案映射未确认。不得将GG与FXZ或星网1.0自动归并。候选归类和待确认路径必须保留原文。\n只描述查询结果支持的事实；区分数据库事实、字段定义解释和未知信息。",
        "value_type": "string"
      },
      {
        "description": "JF集成度竞分业务分析规则；运行时输入数据包由llm_input节点追加。",
        "id": "env-jf-capacitor-analysis-user-prompt",
        "name": "INTEGRATION_COMPETITION_ANALYSIS_USER_PROMPT",
        "selector": [
          "env",
          "INTEGRATION_COMPETITION_ANALYSIS_USER_PROMPT"
        ],
        "value": "请根据user_question、sql_plan、field_meta和本轮MySQL rows完成整机集成度竞分分析。\n1. 开头明确查询设备范围和实际返回记录数；设备身份按厂商、平台、设备类型、设备型号联合识别。\n2. 按用户问题选择Registry字段或复合概念；复合概念只展开Registry列出的真实字段。\n3. 面积单位以area_unit为准。逗号分隔多值按原始顺序原样展示，不拆分做SUM、平均、排序、去重或覆盖。\n4. 优先使用来源已有的integration_total_area_mm2及一级业务域总计；不得通过明细反算任何总计。\n5. 整机总计只对应小系统、外设、无线三个顶层域；其他模块总计、复合项和跨域视图不得混加。\n6. 无线总计不强制等于RF+NC；天线不是第三个加数。\n7. NULL、空字符串、0和原始注释分别处理；缺失值不能当作0。JSON列按各自定义解释。\n8. 对比多台设备时只比较语义和层级一致的字段；不做无依据的优劣排名或综合评分。\n9. 对GG、候选归类、未确认缩写和待确认路径保留原文，不擅自解释。\n10. 设备未被动态标准值目录识别时明确说明未命中，不得将其他设备当作目标设备。\n11. 回答依次包含“## 分析结论”和“## 分析依据”；不重新生成SQL，不改变sql_plan过滤范围。",
        "value_type": "string"
      },
