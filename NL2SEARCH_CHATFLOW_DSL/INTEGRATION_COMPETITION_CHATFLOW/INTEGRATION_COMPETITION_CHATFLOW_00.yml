) for alias in aliases):\n                return fail('REGISTRY_FIELD_ALIASES_INVALID')\n            fields[name]={'label':label,'description':description,'aliases':aliases or [label]}\n    if len(fields)!=282 or sum(1 for name in fields if name.endswith('_area_mm2'))!=267:\n        return fail('REGISTRY_FIELD_INVENTORY_MISMATCH')\n    required_json={'device_design_attributes','raw_value_annotations','additional_metrics','module_chip_models','unmapped_integration_values'}\n    if not required_json<=set(fields):\n        return fail('REGISTRY_JSON_FIELD_INVENTORY_MISMATCH')\n    composites=registry.get('composite_fields')\n    if not isinstance(composites,dict) or not composites:\n        return fail('REGISTRY_COMPOSITES_MISSING')\n    for composite in composites.values():\n        if not isinstance(composite,dict):\n            return fail('REGISTRY_COMPOSITE_INVALID')\n        exact=composite.pop('_expand_exact',[]) or []\n        prefixes=composite.pop('_expand_prefixes',[]) or []\n        contains=composite.pop('_expand_contains',[]) or []\n        if set(exact)-set(fields):\n            return fail('REGISTRY_COMPOSITE_EXACT_FIELD_UNKNOWN')\n        selected=[]\n        for name in fields:\n            lower=name.casefold()\n            if name in exact or any(name.startswith(prefix) for prefix in prefixes) or any(token.casefold() in lower for token in contains):\n                selected.append(name)\n        if not selected:\n            return fail('REGISTRY_COMPOSITE_EXPANSION_EMPTY')\n        composite['expand_to']=selected\n    roles=registry.get('query_roles') or {}\n    if roles.get('sql_select_fields')!='all_fields' or roles.get('sql_filter_fields')!=['manufacturer','platform','device_type','device_model']:\n        return fail('REGISTRY_QUERY_ROLES_INVALID')\n    return {'integration_competition_registry_raw_json':json.dumps(registry,ensure_ascii=False,separators=(',',':')),'integration_competition_registry_load_status':'ok','integration_competition_registry_load_error':'','integration_competition_registry_source':'env.base+3fieldchunks'}\n",
