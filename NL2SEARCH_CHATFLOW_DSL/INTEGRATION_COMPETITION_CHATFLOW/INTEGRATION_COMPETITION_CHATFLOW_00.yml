            "source_code": "def main(integration_competition_registry_raw_json='', integration_competition_registry_load_status=''):\n    import json\n    import re\n    import unicodedata\n\n    def dump(obj):\n        return json.dumps(obj, ensure_ascii=False, separators=(',', ':'))\n\n    def fail(status, message, warnings=None):\n        return {\n            'integration_competition_registry_json': '{}',\n            'integration_competition_alias_index_json': '{}',\n            'integration_competition_registry_parse_status': status,\n            'integration_competition_registry_warnings_json': dump(warnings or []),\n            'integration_competition_registry_error': message,\n        }\n\n    def normalize(value):\n        text = unicodedata.normalize('NFKC', str(value or '')).strip().casefold()\n        return re.sub(r'[\\s_\\-]+', '', text)\n\n    def valid_identifier(value):\n        return bool(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', str(value or '')))\n\n    if str(integration_competition_registry_load_status or '') != 'ok':\n        return fail(str(integration_competition_registry_load_status or 'missing'), 'JF集成度竞分查询配置未加载，无法生成 SQL 查询。')\n\n    try:\n        registry = json.loads(integration_competition_registry_raw_json or '{}')\n    except Exception as exc:\n        return fail('error', 'INTEGRATION_COMPETITION_QUERY_REGISTRY_JSON 不是合法 JSON：%s' % exc)\n\n    if not isinstance(registry, dict):\n        return fail('error', 'INTEGRATION_COMPETITION_QUERY_REGISTRY_JSON 顶层不是对象。')\n\n    table = str(registry.get('table') or '').strip()\n    fields = registry.get('fields') if isinstance(registry.get('fields'), dict) else {}\n    composites = registry.get('composite_fields') if isinstance(registry.get('composite_fields'), dict) else {}\n    query_roles = registry.get('query_roles') if isinstance(registry.get('query_roles'), dict) else {}\n    value_aliases = registry.get('value_aliases') if isinstance(registry.get('value_aliases'), dict) else {}\n    match_policies = registry.get('match_policies') if isinstance(registry.get('match_policies'), dict) else {}\n\n    warnings = []\n    errors = []\n\n    if 'match_policies' in registry and not isinstance(registry.get('match_policies'), dict):\n        errors.append('registry.match_policies 不是对象')\n    if not table or not valid_identifier(table):\n        errors.append('registry.table 缺失或不是安全 SQL 标识符')\n    if not fields:\n        errors.append('registry.fields 缺失或为空')\n\n    sql_filter_fields = query_roles.get('sql_filter_fields') if isinstance(query_roles.get('sql_filter_fields'), list) else []\n    for field in sql_filter_fields:\n        if field not in fields:\n            errors.append('sql_filter_fields 包含未定义字段: %s' % field)\n        if not valid_identifier(field):\n            errors.append('sql_filter_fields 包含非法字段名: %s' % field)\n\n    for field_name, field_cfg in fields.items():\n        if not valid_identifier(field_name):\n            errors.append('fields 包含非法字段名: %s' % field_name)\n        aliases = field_cfg.get('aliases') if isinstance(field_cfg, dict) else []\n        if not isinstance(aliases, list) or not aliases:\n            errors.append('字段缺少 aliases: %s' % field_name)\n\n    for composite_name, composite_cfg in composites.items():\n        if not isinstance(composite_cfg, dict):\n            errors.append('composite_fields.%s 不是对象' % composite_name)\n            continue\n        for ref in composite_cfg.get('expand_to') or []:\n            if ref not in fields:\n                errors.append('composite_fields.%s.expand_to 引用未定义字段: %s' % (composite_name, ref))\n\n    for value_field in value_aliases.keys():\n        if value_field not in fields:\n            warnings.append({'type': 'value_aliases_field_not_in_fields', 'field': value_field})\n        if value_field not in sql_filter_fields:\n            warnings.append({'type': 'value_aliases_field_not_sql_filter_field', 'field': value_field})\n\n    for policy_field, policy_cfg in match_policies.items():\n        if policy_field not in fields:\n            errors.append('match_policies 包含未定义字段: %s' % policy_field)\n        if not isinstance(policy_cfg, dict):\n            errors.append('match_policies.%s 不是对象' % policy_field)\n            continue\n        fuzzy = policy_cfg.get('fuzzy')\n        if fuzzy is None:\n            continue\n        if not isinstance(fuzzy, dict):\n            errors.append('match_policies.%s.fuzzy 不是对象' % policy_field)\n            continue\n        if not isinstance(fuzzy.get('enabled'), bool):\n            errors.append('match_policies.%s.fuzzy.enabled 必须为布尔值' % policy_field)\n            continue\n        if fuzzy.get('enabled') is not True:\n            continue\n        for boolean_key in ('require_same_digits', 'require_protected_tokens_equal'):\n            if not isinstance(fuzzy.get(boolean_key), bool):\n                errors.append('match_policies.%s.fuzzy.%s 必须为布尔值' % (policy_field, boolean_key))\n        min_alias_length = fuzzy.get('min_alias_length')\n        min_score_gap = fuzzy.get('min_score_gap')\n        rules = fuzzy.get('distance_rules')\n        tokens = fuzzy.get('protected_tokens')\n        if isinstance(min_alias_length, bool) or not isinstance(min_alias_length, int) or min_alias_length < 1:\n            errors.append('match_policies.%s.fuzzy.min_alias_length 必须为大于等于 1 的整数' % policy_field)\n        if isinstance(min_score_gap, bool) or not isinstance(min_score_gap, (int, float)) or not 0 <= min_score_gap <= 1:\n            errors.append('match_policies.%s.fuzzy.min_score_gap 必须在 [0,1] 内' % policy_field)\n        if not isinstance(rules, list) or not rules:\n            errors.append('match_policies.%s.fuzzy.distance_rules 必须为非空列表' % policy_field)\n        else:\n            for index, rule in enumerate(rules):\n                if not isinstance(rule, dict):\n                    errors.append('match_policies.%s.fuzzy.distance_rules[%s] 不是对象' % (policy_field, index))\n                    continue\n   