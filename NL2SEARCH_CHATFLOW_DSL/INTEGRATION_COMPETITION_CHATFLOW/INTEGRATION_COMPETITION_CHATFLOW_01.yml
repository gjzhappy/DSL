              },
              "integration_competition_sql_compile_error_answer": {
                "type": "string",
                "children": null
              },
              "integration_competition_selected_field_meta_json": {
                "type": "string",
                "children": null
              },
              "integration_competition_select_field_summary": {
                "type": "string",
