        {
          "id": "integration_competition_sql_plan",
          "type": "custom",
          "data": {
            "title": "规划整机集成度查询方案",
            "type": "code",
            "outputs": {
              "integration_competition_sql_plan_json": {
                "type": "string",
                "children": null
              },
              "integration_competition_sql_compile_status": {
                "type": "string",
